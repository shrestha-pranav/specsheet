# Source publication policy: the ONE file that gates the free build, the paid export and the licence grant.
# Owner: A5 PM (dispositions) / A3 (gate code). Decision: product/decisions.md D1.3 (PM round 3, 2026-11-24).
# Draft 2026-11-24: not yet read by any build. A3 wires it (team/briefs/pm-2026-11-24-licensing-gate.md).
#
# Per domain (matched against the hostname of every source URL; `match: subdomains` also matches *.domain):
#   free           true|false  value may appear in the free site/static JSON/Worker preview, as a fact + source link
#   paid           true|false  value may appear in any paid artifact (query/match/changes/bulk with PAYMENTS=on)
#   licence_grant  true|false  value is offered under OUR ODbL grant (DATA-LICENSE.md). no = shown as a fact with a
#                             source link; we grant nothing over it and make no claim about the source's terms.
#   evidence       level: fetched | search | blocked | none, refs: [urls], checked: date. paid/licence_grant = yes
#                  REQUIRES level fetched and a ref showing permission; the gate rejects the file otherwise.
#   withhold_keys  [spec keys]  optional; these keys are withheld for this source in every tier (field-scope takedown)
#   other keys     match (exact|subdomains), kind, credit, categories, conditions, to_clear, audit_ref. Anything else = invalid.
# Invariants enforced by the gate: licence_grant yes => free yes; paid yes => licence_grant yes.
# Changing any disposition = bump policy_version (date.N), add a changelog line. Builds stamp the version into
# manifest.json; a release refuses to promote with a policy version older than the one in git.
policy_version: "2026-11-24.8"
changelog:
  - {version: "2026-11-24.8", by: coordinator, note: "Codex review-6 fix 3: images.salsify.com reclassified maker -> document_host (inherit: linking_page); a shared CDN must not carry an unconditional disposition or act as an inheritance endpoint."}
  - {version: "2026-11-24.7", by: A2/A3 doc parsers r2, note: "Added images.teamgroupinc.com (TEAMGROUP's own spec-sheet PDF host, linked from www.teamgroupinc.com product pages; docspec@1 documents) with maker default disposition, same as www.teamgroupinc.com."}
  - {version: "2026-11-24.6", by: A3 document pipeline, note: "New kind document_host (inherit: linking_page): shared document CDNs carry the disposition of the maker page that linked the document (scripts/source_policy.py disposition(url, linked_from)); their own flags are the all-false fallback for a document with no linking page. Added cdn.shopify.com, cdn.shopifycdn.net and three per-customer CloudFront distributions seen hosting maker manuals (d2211byn0pk9fi, dix7fd4yse9rd, dz02g1kgtiysz). s3.belkin.com added as a Belkin maker host (maker default disposition)."}
  - {version: "2026-11-24.5", by: coordinator, note: "Added documents.sandisk.com (SanDisk datasheet host) with maker default disposition."}
  - {version: "2026-11-24.4", by: A2, note: "Added techspecs.ui.com (Ubiquiti, ubiquiti-us-routers), www.gl-inet.com (GL.iNet, glinet-us-routers) and www.benq.com (BenQ, benq-us-monitors), new maker sources of coverage r3. Same disposition as the other unaudited makers: free yes, paid no, no licence grant."}
  - {version: "2026-11-24.3", by: coordinator, note: "Added 12 maker domains cited by new adapters (dell, byjasco, microsoft x2, razer, support.apple, baseus, furmanpower, austere, plugable, nekteck) plus images.salsify.com (maker document CDN). Same disposition as other unaudited makers: free yes, paid no, no licence grant."}
  - {version: "2026-11-24.2", by: A2, note: "Added www.kingston.com (Kingston datasheet PDFs, new source kingston-us-ssd) with the same disposition as the other SSD makers (free yes, paid no, no licence grant)."}
  - {version: "2026-11-24.1", by: A5, note: "First version. Replaces api-worker/licensing-exclusions.json (exclusions, paid only) and the public_domain flags in docs/sources.json. Makers moved paid yes->no (unaudited). iniushop.com reclassified retail->maker (INIU's own store)."}

defaults:
  # A domain that is not listed below. Withheld from the licence grant and from paid. Shown free as fact + link,
  # but a RELEASE build (release.sh) fails while any published value cites an unlisted domain, so every
  # published domain carries an explicit disposition. Non-release builds warn and list the domains.
  unlisted: {free: true, paid: false, licence_grant: false}
  fail_release_on_unlisted: true

# What a value needs, per tier (applied to the value's own sources[], after dropping sources not allowed in the tier):
#   a value is kept in a tier iff at least one of its sources is allowed in that tier; the kept sources[] list
#   shows ONLY the allowed sources (a disallowed source is never cited, linked or counted in that tier).
#   licence: a value is "granted" iff at least one remaining source has licence_grant yes.
record_rules:
  drop_record_fields: [media]          # images/media are never published in any tier
  exclude_demo_records: true
  exclude_categories: [power-strips-demo]
  withheld_status: not_published       # status shown when a value existed but no source is allowed in the tier

