  - {version: "2026-11-26.2", by: coordinator, note: "ToS consistency: www.se.com + www.apc.com -> crawl human_only (terms limit reproduction to personal non-commercial use; same standard as Samsung/Apple ruling 2026-11-25.6). No APC values published."}
