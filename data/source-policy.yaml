# Source publication policy: the ONE file that gates the free build, the paid export and the licence grant.
# Owner: A5 PM (dispositions) / A3 (gate code). Decision: product/decisions.md D1.3 (PM round 3, 2026-11-24).
# Draft 2026-11-24: not yet read by any build. A3 wires it (team/briefs/pm-2026-11-24-licensing-gate.md).
#
# Per domain (matched against the hostname of every source URL; `match: subdomains` also matches *.domain):
#   free           true|false  value may appear in the free site/static JSON/Worker preview, as a fact + source link
#   paid           true|false  value may appear in any paid artifact (query/match/changes/bulk with PAYMENTS=on)
#   licence_grant  true|false  value is offered under OUR ODbL grant (DATA-LICENSE.md). no = shown as a fact with a
#                             source link; we grant nothing over it and make no claim about the source's terms.
#   evidence       level: fetched | search | blocked | none, refs: [urls], checked: date. paid/licence_grant = yes
#                  REQUIRES level fetched and a ref showing permission; the gate rejects the file otherwise.
#   withhold_keys  [spec keys]  optional; these keys are withheld for this source in every tier (field-scope takedown)
#   crawl          agent|human_only|none (2026-11-25.1, D9): may OUR crawler fetch this host. agent = yes (robots.txt still applies);
#                  human_only = agents never fetch it, a person may read and cite it (corrections flow, D9.2); none = excluded
#                  (needs free: false). Absent = agent. Separate from publication (free/paid/licence_grant).
#   kind           government | certification | maker | retail_or_review | document_host | measurement (independent measured
#                  source, D10: must state crawl; paid and licence_grant false, values are free linked facts only)
#   other keys     match (exact|subdomains), credit, categories, conditions, to_clear, audit_ref, inherit. Anything else = invalid.
# Invariants enforced by the gate: licence_grant yes => free yes; paid yes => licence_grant yes.
# Changing any disposition = bump policy_version (date.N), add a changelog line. Builds stamp the version into
# manifest.json; a release refuses to promote with a policy version older than the one in git.
policy_version: "2026-11-26.14"
changelog:
