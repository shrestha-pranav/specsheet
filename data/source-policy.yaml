defaults:
  # A domain that is not listed below. Withheld from the licence grant and from paid. Shown free as fact + link,
  # but a RELEASE build (release.sh) fails while any published value cites an unlisted domain, so every
  # published domain carries an explicit disposition. Non-release builds warn and list the domains.
  unlisted: {free: true, paid: false, licence_grant: false}
  fail_release_on_unlisted: true

# What a value needs, per tier (applied to the value's own sources[], after dropping sources not allowed in the tier):
#   a value is kept in a tier iff at least one of its sources is allowed in that tier; the kept sources[] list
#   shows ONLY the allowed sources (a disallowed source is never cited, linked or counted in that tier).
#   licence: a value is "granted" iff at least one remaining source has licence_grant yes.
record_rules:
  drop_record_fields: [media]          # images/media are never published in any tier
  exclude_demo_records: true
  exclude_categories: [power-strips-demo]
  withheld_status: not_published       # status shown when a value existed but no source is allowed in the tier

