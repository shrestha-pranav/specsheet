- id: claim/tvs-structured@1
  since: '2026-11-23'
  rationale: 'Televisions: the ENERGY STAR Certified Televisions record (regulatory) and the makers'' own labelled US spec data (Samsung spec API, LG
    __NEXT_DATA__ spec table, TCL per-size spec boxes). Labelled rows only, never titles or prose, and review-3 rules from the start: (1) no
    negation-blind enums: Dolby Vision / HDR10+ / VRR / ALLM / HGiG / ATSC 3.0 come from their own rows with an affirmative value, false only from a
    row whose value is just No (ATSC: a tuner row naming 1.0 and not 3.0); a format missing from a list is unknown; processing names (UHD Dimming,
    Precision Dimming) are not local dimming; shifted Samsung rows (FreeSync holding accessibility text, a resolution in Product Type) are ignored;
    (2) explicit membership: hdmi.ports_4k120 only from a per-port statement (Samsung for HDMI 1/2/3/4, TCL HDMI 1-2 / 3-4 splits, LG trailing (N
    port)), never from a generic feature list; (3) bases in conditions: on-mode/standby/annual figures carry power_basis (energy_star_on_mode,
    doe_federal_test, energy_star_standby, maker_typical, maker_unstated) so a test figure and a declaration never merge; native refresh never
    from a motion/marketing figure; (4) conflict-aware grouping: one size = one model number; TCL boxes attributed only by a Model row equal to
    the SKU or a unique size match that agrees with the SKU; a printed size contradicting the model number is unresolved; retailer designations
    group only through the maker''s ENERGY STAR same-hardware declaration (aliases), stem matches are proposals. NOT accepted (preview only):
    refresh.max_hz (VRR/PC maxima, sometimes DLG), hdr.peak_nits (window/mode unstated), Samsung panel.backlight (read from a "Contrast" row),
    ENERGY STAR panel.backlight (Mini-LED sets certify as Direct-lit), every status-unknown plausibility rejection.'
