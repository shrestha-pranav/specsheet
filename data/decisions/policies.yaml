    evidence: 'team/reports/2026-11-25-a2-r6-dell.md; @1 vs @2 over all 89 stored pages: +18 usb.usbc_inputs 0 (complete_enumeration), nothing else changed; 89 pages fetched 2026-11-25 (9 listing pages, all 200), 89 models parsed, 0 absences; per-key counts in the report; tests/test_a2_r6_dell.py'
