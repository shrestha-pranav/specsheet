  rationale: 'Air purifiers: the ENERGY STAR Certified Room Air Cleaners V3.0 record and the CARB certified air cleaning devices list (regulatory),
    plus the makers'' own labelled US spec rows (Levoit Product Specifications list, Winix WooCommerce attribute table + Replacement Filter tab).
    Labelled fields only, never titles or prose, with review-3/4 rules from the start: (1) affirmative-only flags: filter.true_hepa only from an ES
    filter type exactly "HEPA" (the dataset defines it as True HEPA) or a maker row saying "True HEPA", never false; "HEPA-Type" is hepa_class only;
    ozone.carb_certified only from the CARB list itself, dated by EO number + date notified, absence = unknown; booleans false only from an own
    field whose value is a bare No; (2) bases in conditions: every CADR carries cadr_basis (energy_star_certified / aham_verified_maker_stated /
    maker_claimed: AHAM only when the same table says AHAM), room sizes carry room_basis and ach, noise carries fan_speed (printed ranges =
    range_min/range_max), power carries power_basis; no watts derived from CADR/W; (3) conflict-aware grouping: certifier rows of one exact
