- id: claim/mfr-power-stations-structured@1
  since: '2026-11-23'
  rationale: 'Portable power stations, manufacturer-owned US store spec tables (EcoFlow, BLUETTI, Jackery, Goal Zero, Anker SOLIX). Only labelled spec
    rows are read (never prose or titles) and review-3 rules hold from the start: (1) no negation-blind keyword enums: waveform, chemistry, UPS,
    expandability and UL 2743 / UL 9540 come only from their own labelled rows with an affirmative phrase, false only from a row whose value is just
    No; (2) totals only with explicit membership: AC continuous = the AC row tagged total/rated/continuous (or the single AC row with one W figure),
    combined solar input only from a printed total/dual-port/Double-to figure or one unmultiplied figure, best single USB-C only from a figure printed
    for one port or per port, no cross-port sum; (3) capacity bases separate: rated pack Wh, usable Wh (labelled only), pack V and Ah are distinct keys,
    two Wh figures in a cell are unresolved, Wh is never computed; (4) conditions carry each basis: cycle life retention_pct, recharge charge_to_pct +
    charger, UPS backup_mode, solar window voltage_basis (+ port), AC input ac_charge_mode, expanded Wh extra_batteries; (5) conflict-aware grouping:
    unit variants vs package variants (solar/battery/charger bundles are never aliases or spec sources), several unit SKU stems = absence, Jackery
    per-variant blocks kept apart (230 V blocks skipped), a block that splits values per model or names another product = absence. exp.batteries
    (name extraction) is deliberately NOT accepted.'
  audit:
    by: A1+A2 power stations
    at: '2026-11-23'
    evidence: Parsed every stored page of the five sources; spot-checked one table per model (team/reports/2026-11-23-a12-power-stations.md);
