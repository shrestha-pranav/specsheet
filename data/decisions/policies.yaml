    model number printed in the page''s Energy Guide (equal to the canonical URL; a page where they disagree, or that has no spec rows, yields nothing).
    Every @1 rule is carried over unchanged for the four sources it already covered; the Vizio key list is explicit and follows the same review-3
    rules: refresh.native_hz only from the "Refresh Rate" row (a cell naming two rates is skipped, "Dynamic Motion Rate" goes to refresh.marketing);
    vrr.supported only when the row is a bare affirmative feature name (HDMI VRR / FreeSync tiers); HDR formats only from the list the row prints,
