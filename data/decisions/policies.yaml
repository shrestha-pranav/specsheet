# Versioned auto-accept policies (scripts/decisions.py; ARCHITECTURE 15.8). A policy's meaning is FROZEN per id: data/decisions/policy-lock.jsonl
# holds sha256(policy minus `approval`); import.py fails if the content under a locked id changes. Changing what a policy accepts = a new id
# (@N+1) and the old one moved verbatim to retired_policies (+ a `retired` note, not hashed). Claim policies need explicit source_ids,
# extractors and keys (list or {source_id: [keys]}); relation policies are explicit {method, types, parsers} rules.
# audit.parsers = the parser fingerprints audited (crawler/adapters/registry.py parser_fingerprint); drift fails `import.py --strict-parsers`.
# approval = who (a HUMAN handle) approved the policy and when; `pending` policies apply but are listed in every release manifest.
# A claim accepted by a policy publishes in the trusted index with review.by = <policy id>. Everything else is a candidate
# (preview dataset only) until a human ledger line (ledger.jsonl) accepts or rejects it.
format: specsheet.policies/2
claim_policies:
