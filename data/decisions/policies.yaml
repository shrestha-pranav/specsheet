- id: claim/mfr-power-banks-structured@7
  since: '2026-11-24'
  supersedes: claim/mfr-power-banks-structured@6
  rationale: 'Same sources, kinds, tiers and normalisation as @6, re-issued for the A2 preset-fill bump of all nine extractors (@4 -> @5). Changes:
    (1) pd.pps false is now possible, ONLY by complete enumeration (A1 ruling 1, coordinator 2026-11-24): UGREEN (ugreen_powerbanks@5) writes false
    when its spec block prints the port inventory (''Ports USB-A*1 USB-C*2''), every inventory output port has its own protocol list in the
    ''Support Protocol'' block, no list is open-ended (''etc.'') and none names PPS; the claim carries the basis condition basis=complete_enumeration
    (research/power-banks/spec-profile.yaml condition + pd.pps basis_conditions) and keeps the list as raw. (2) pd.pps true also from a per-port
    protocol list naming PPS (UGREEN) and from an Anker output protocol row named PPS (''PPS: 65W'', ''[USB-C]-PPS: ...''); never from a USB-A row.
    (3) UGREEN per-port ''USB-C1 Output: ... USB-C2 Output: ...'' rows are read as the port list (out.ports, out.max_single_port_w, pd.max_fixed_voltage).
    (4) WIDENING: out.max_single_port_w added to the belkin-us-powerbanks and mophie-us-powerbanks allowlists. Belkin only from a figure the maker
    labels single-port (''140W Single 158W Shared'', ''Maximum single USB-C output: Up to 100W'', At a Glance ''up to 65W from a single USB-C port'');
    mophie only as the max of an Output row whose every entry names exactly one port (''1 USB-C Port - 100W1 USB-C Port - 45W...''); ''2 USB-C Ports
    - 45W'', ''Cable and Port: 20W'' and bare wattages write nothing. INIU, CUKTECH, EcoFlow, SHARGE and KUXIU: version bump only (shared module), 0 claim changes.'
  audit:
    by: A2 preset fill
    at: '2026-11-24'
    evidence: 'team/reports/2026-11-24-a2-preset-fill.md; claim diff base (copy of crawler/ before this round) vs new parsers over every stored snapshot of the nine sources: +2 anker pd.pps true (A1259, A1339), +6 belkin out.max_single_port_w (BBA009 15, BBA019 140, BBA024 100, BPB020 65, BPB040 140, BPD010 15), +7 mophie out.max_single_port_w, ugreen +2 out.max_single_port_w / +2 out.ports / +2 pd.max_fixed_voltage (35524, two handles), +5 pd.pps true, +2 pd.pps false basis=complete_enumeration (25208, 90597A); 1 ugreen pd.pps true re-raw (65958: now the protocol list); 0 removals; INIU/CUKTECH/EcoFlow/SHARGE/KUXIU 0 changes. Fixtures tests/test_preset_fill_powerbanks.py.'
