  supersedes: rel/source-stated-hierarchy@1
  rationale: The manufacturer source itself states the link. @2 replaces the open globs adapter:* / page-variants:* with one explicit rule per source method,
    relation type and parser version that produced the relations @1 approved; a new adapter, a new relation type or a parser bump gets nothing until a rule
    is added (new id). Suffix-inferred (suffix:*) and stem (stem:*) links are never covered.
  audit:
    by: A3-impl r4
    at: '2026-11-23'
    evidence: 'rules = the (method, type, parser) triples @1 approved in the last release import (4,137 links): no widening.'
