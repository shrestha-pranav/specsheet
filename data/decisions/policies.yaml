# Versioned auto-accept policies (scripts/decisions.py; ARCHITECTURE 15.8). A policy's meaning is FROZEN per id: data/decisions/policy-lock.jsonl
# holds sha256(policy minus `approval`); import.py fails if the content under a locked id changes. Changing what a policy accepts = a new id
# (@N+1) and the old one moved verbatim to retired_policies (+ a `retired` note, not hashed). Claim policies need explicit source_ids,
# extractors and keys (list or {source_id: [keys]}); relation policies are explicit {method, types, parsers} rules.
# audit.parsers = the parser fingerprints audited (crawler/adapters/registry.py parser_fingerprint); drift fails `import.py --strict-parsers`.
# approval = who (a HUMAN handle) approved the policy and when; `pending` policies apply but are listed in every release manifest.
# A claim accepted by a policy publishes in the trusted index with review.by = <policy id>. Everything else is a candidate
# (preview dataset only) until a human ledger line (ledger.jsonl) accepts or rejects it.
format: specsheet.policies/2
claim_policies:
- id: claim/smart-home-zigbee2mqtt@2
  since: '2026-11-26'
  supersedes: claim/smart-home-zigbee2mqtt@1
  rationale: 'Re-issue of claim/smart-home-zigbee2mqtt@1 (locked by my own first import, never approved, never released): claim stage adapter (the record schema enum; @1''s ts_definition made every claim invalid) and sources cite the raw.githubusercontent.com file URL the source-policy lists. A2-home r12 (brief coord-2026-11-26-r12, lane A2-home). New category smart-home; new cross-brand source zigbee2mqtt-devices
    (crawler/adapters/zigbee2mqtt_devices.py): the Zigbee2MQTT device database, Koenkk/zigbee-herdsman-converters src/devices/*.ts on
    raw.githubusercontent.com (MIT; source-policy kind measurement, crawl agent, free yes / paid no / no licence grant). Definitions are cut
    from the stored TypeScript by a brace scanner, never evaluated. Claims are kind REPORTED, source tier other (a community integration
    database, not the maker). Identity: mfr_model = Z2M model as written, issuer = vendor slug; slash lists stay one row; Tuya TS0xxx module
    ids, digit-less names and > 60-char strings mint nothing. Values: conn.protocols [zigbee] and compat.zigbee2mqtt true for every row;
    capability booleans true from the exposes / extend helpers named in the definition; FALSE only when every top-level exposes / extend
    item is an e.* / m.* call (a complete static enumeration: no vendor helper, variable, spread, arrow function) and only when every
    definition of the model agrees; gen.device_type by the adapter''s DEVICE_TYPE rule table; power.source only battery (never mains).
