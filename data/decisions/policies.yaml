  rationale: 'Ubiquiti UniFi gateways + access points from techspecs.ui.com (ubiquiti_routers@1: the page''s labelled technicalSpecification tree, per-band rows are children named by their band) and GL.iNet routers from the Specifications table of their own store pages (glinet_routers@1; comparison tables on the same page are never read). Only the listed keys, only values that normalise. Per-band streams only from an NxN band row, widths only from that band''s ''(BWnnn)'' max-rate row, has_6ghz only True. hw.soc_vendor only where the maker names the vendor (GL.iNet ''MediaTek Quad-core''), hw.soc_model only from an explicit part (IPQ6000, MT7981B); Ubiquiti names CPU cores (''Cortex-A53''), never the SoC, so it writes cores/GHz only. Ubiquiti port.lan_count = Port Layout total minus the stated default WAN ports (console/MGMT excluded). gen.device_type from the maker''s own classification (URL section / Shopify product_type). port.poe is the maker''s power-method / PoE-budget text.'
