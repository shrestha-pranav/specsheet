- id: claim/mfr-robovac-structured@5
  since: '2026-11-23'
  supersedes: claim/mfr-robovac-structured@4
  rationale: 'Robot vacuums, the manufacturer''s own labelled spec rows: ONE consolidated policy for all six US stores (Dreame, Roborock, Narwal, ECOVACS,
    iRobot, MOVA), replacing the overlapping @2/@3/@4 (which stay in claim_policies only because tests/test_adversarial.py requires retired ids to be @1;
    they match only the @1/@2 extractor versions, which no longer exist in code, so they accept nothing). Review 3 (reviews/2026-11-23-astra-review-3.md)
    parser changes, every extractor version-bumped: (1) nav.type / nav.obstacle_sensors / mop.type are emitted only for explicit mechanism phrases (LDS/LiDAR,
    dToF, vSLAM, gyro; structured light / line laser, RGB/RGBD, ToF; dual + rotating mops, roller, vibrating); generic laser/camera/visual, trademarks,
    single rotating mops, several mechanisms in one cell and any negation become status-unknown claims (literal + reason, preview only). (2) claim_basis
    needs an affirmative, figure-specific attribution: ''certified by <certifier>'' -> mfr_reported_certified, in-house lab -> mfr_in_house_lab; negated
    or bare ''laboratory'' -> mfr_unstated. (3) Bundle members whose model name disagrees with the canonical page beyond pack words (Complete) are quarantined
    to identity review (no SKU aliases); discovery grouping unions on equal names or SKU + equal pack_base only. (4) Robot dimensions/weight outside the
    robot bounds and mixed robot+dock cells are kept as status-unknown claims with the literal and the reason instead of being dropped. Keys = @3/@4 per
    source MINUS smart.matter: Matter is trusted only from claim/dcl-matter-certified (CSA exact match). Only listed keys, only normalised status-known
    values.'
  audit:
    by: A3-impl r5 (review-3 fixes)
    at: '2026-11-23'
