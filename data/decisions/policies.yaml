- id: claim/mfr-chargers-structured@1
  since: '2026-11-24'
  rationale: 'USB chargers (category chargers, superseding the v0 gan-chargers pilot): the makers'' own labelled US store spec rows (Anker Specifications
    table + key_parameter list, Belkin Technical Specifications, Shopify store spec tables / label-value rows). Labelled fields only, never titles,
    prose or prices, with review-3 rules from the start: (1) out.max_total_w only from a row the maker labels total (Total Output / Total Wattage /
    Anker Total Capacity in W); out.all_ports_w only with explicit port membership (a printed combination naming every individual port, or an
    N-ports-in-use row with N = the printed port count); additive splits, subsets and unmatched in-use rows stay status-unknown; a single unlabelled
    wattage (Belkin Wattage, mophie Output) is out.rated_w, never total or single-port, and is unresolved when the maker title prints a different
    single wattage; (2) per-port PDOs and PPS ranges as printed (wattage never computed from V x A; per-port protocol lists are not PDOs);
    pd.pps / pd.epr / phys.foldable_plug affirmative only (EPR = a printed fixed PDO of 28 V or more); (3) identity = the maker model number or the
    documented SKU-stem rule per brand (research/chargers/identity.md); pages with several model numbers, N-pack/bundle pages, wireless and 2/3-in-1
    sets mint nothing. NOT accepted (preview only): gen.gan and gen.form_factor (title-derived), gen.product_line (title), pd.protocols (literal
    maker tokens, not normalised), id.msrp_us (dated price), every status-unknown claim.'
  audit:
    by: A1+A2 chargers
    at: '2026-11-24'
    evidence: Parsed every stored snapshot of the charger sources; per-key sanity checks (single-port <= total, all-ports <= total, port rows
