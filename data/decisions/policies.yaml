    docattach@2 so claim/document-power-pdo@4 stays pinned. A kind: hub page (data/document-hubs.yaml: www.mophie.com/pages/user-manuals) is
    never an entity source. A hub -> document edge binds only through the document text: the document must quote the entity''s own mfr_model /
    mfr_sku (docattach identity, bounded mention, OCR mention only at >= 60 per word); a shared identifier, another SKU of the same base or a
    foreign region token = no bind; rows are scoped by docattach@2 scope_of (with a sibling named, only the row''s own block / page naming this
    entity alone binds; shared rows of a multi-SKU manual bind to nobody); a document quoting no catalogued entity attaches nothing. Text-layer
    rows with text-layer, variant-exact identity only (OCR-dependent or variant-unestablished = hubdoc-review@1, never accepted). Locator records
    linked_from = hub URL, link_role hub, identity_basis document_quote; the document is on the maker''s own host (www.mophie.com, kind maker).
    Same keys as document-power-pdo@4. Affirmative only.'
