    letters+digits, the sandisk_datasheets@1 rule); a document naming a same-brand model not on any of its linking pages attaches nothing. Text
    layer only (no OCR). Only single spanning table cells are read (a cell split into per-capacity columns, or one key with two values in one
    document, reads nothing). SSDs: if.protocol usb / usb_uasp only from an INTERFACE row naming USB 2.0 / 3.x (Thunderbolt, USB4 or a
    connector-only cell = nothing, ruling 4); hw.dram_type Yes / DRAM part -> dram, HMB -> dramless_hmb, No / None / DRAM-less -> dramless
    (ruling 5; not emitted next to a page dramless_hmb / dramless_none, the same fact less specific); hw.nand_type exactly one of SLC..PLC
    ("3-bit MLC" = tlc); hw.controller a part-like token only. Monitors: flk.pwm none only from a "Flicker Safe" / "Flicker-free" cell reading Yes
    or a bullet (same meaning as the lg/asus page label rule flicker_free); usb.usbc_pd_w only from "USB Type-C with N W Power Delivery"
