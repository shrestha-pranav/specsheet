  supersedes: claim/mfr-monitor-dell@1
  rationale: 'Same-round re-issue of @1 for dell_monitors@1 -> @2 (@1 was locked by the round''s first import, never approved). ADDED vs @1: usb.usbc_inputs 0 (basis complete_enumeration) also when the Interface/Port Details list is cross-checked complete because its USB-C lines add up to Total Number of USB Type-C Ports (Dell''s ''2 HDMI ports'' count style is now read as a video input, so this check fires), or, with no USB-C/Thunderbolt row or line anywhere on the page, its USB lines add up to Number of USB Ports (+18 zeros: Alienware/P/E models whose only USB-C ports are downstream or that have none). Everything else as @1: new source dell-us-monitors (crawler/adapters/dell_monitors.py, A2-dell r6 brief item 1): the Tech Specs block of www.dell.com /en-us/shop/.../apd/<slug>/<code>/- pages (www.dell.com is already in data/source-policy.yaml, maker, categories laptops + monitors; robots allows the /apd/ pages and the /ar/ listing used for discovery). One page = one model: mfr_model = the Product Model row, which must equal the URL code (a ''<model> WOST'' page is the same model sold without stand); the Dell part number is an x_dell_part_number alias. Rules: flk.pwm none ONLY from the explicit ''Flicker Free: Yes'' row or a ''Flicker-free'' Features item (''Flicker Free: No'', ComfortView, Eye Comfort stars and silence write nothing); res.refresh_native only when ''Standard Refresh Rate'' equals the highest ''Maximum Preset Resolution'' rate at the native resolution and no row says overclock (AW2524HF prints Standard 500 Hz vs a 480 Hz preset: native not written); res.refresh_max = the higher of the two; usb.usbc_inputs from the Interface/Port Details list via _monports (an ambiguous USB-C line writes nothing), 0 only from the maker''s ''USB Type-C: No'' row with no Thunderbolt/USB-C elsewhere, or as complete_enumeration when every USB-C port the ''Total Number of USB Type-C Ports'' row counts is listed and none takes video; usb.usbc_pd_w only from an upstream-side Power Delivery row (or, with no such row, the USB-C video input line) with one W figure, Downstream rows never; usb.kvm True only from ''KVM Switch'' in Built-in Devices; vin.hdmi_count / vin.dp_count only when the count row agrees with the port-details list (and dp_count never on a page with DisplayPort Output: Yes); size class as stated (whole inch).'
