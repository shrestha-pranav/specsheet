    upscale + tesseract). Maker gallery spec images (cdn.shopify.com, a document_host inheriting the linking page) found on a REGISTERED maker
    page the entity is observed on (edge verified as docattach@2). Identity: inherited only when the linking page is single-SKU (exactly one
    non-bundle variant SKU and it is an own SKU of the entity), every model token in the image file name is an own identifier, and the OCR text
    names no other model; otherwise the image must name an own model/SKU with every word of the mention at token confidence >= 60 and no
    sibling, and is variant-exact only when that mention is an own SKU with no other SKU of the base, region token or shared identifier in play
    (else specimg-review@1, never accepted). Values: docparse@2 grammar and port attribution unchanged; an electrical value line is read only
    when the mean confidence of its digit-bearing words is >= 70 (and every row >= 60 via docparse@2) and no value token is ambiguous (split
    digits "3.3-1 1V", letter/digit confusions "1JOOW", dangling decimals); a rejected line closes any open row. Same keys as
    document-power-pdo@4 minus pd.epr (no image source of it). Affirmative only.'
