- id: rel/air-purifiers-es-same-hardware@1
  since: '2026-11-24'
  rationale: 'r8 identity follow-up (b). Rule for an ES declared same-hardware alias that is also another source''s model key: no merge, both ids
    kept; a directed same_hardware_as edge alias -> certified base carrying the ES evidence (record, declaration clause, date). Approved only for
    method es-declared:exact: the raw clause is an exact affirmative declaration (no "only difference", "identical in performance",
    "derivative", negation), the record states United States, the certification is dated, the alias is declared under one base, and no
    compare_key (CARB type, smoke/dust/pollen CADR, technologies) disagrees. es-declared:not-exact / market / undated / several-bases / conflict
    stay proposals. model_variant aliases get no edge.'
