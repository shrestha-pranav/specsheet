    at: '2026-11-26'
    evidence: 'reviews/2026-11-26-astra-review-10.md P1-2 (both read-only probes now emit nothing); team/reports/2026-11-26-a3-review10-fixes.md; in-memory claim diff HEAD vs new parsers over every stored snapshot: 0 derived pd.pps claims added or removed (Anker A1638 unchanged). tests/test_review10.py Sfc2Identity'
