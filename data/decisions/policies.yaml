  since: '2026-11-24'
  supersedes: claim/mfr-routers-structured@2
  rationale: 'Same sources, kinds, tiers, statuses and key list as @2, re-issued for tplink_routers@2 -> @3, netgear_routers@1 -> @2, asus_routers@1 -> @2 (all import crawler/adapters/_router.py). WIDENING (values, not keys): wifi.has_6ghz may now be False, under coordinator ruling 1 (2026-11-24, complete-enumeration negatives): only when the maker''s own spec table prints a complete band list that names 2.4 + 5 GHz and no 6 GHz (_router.band_enum: every GHz figure in the cell is a band token, no ''up to''/''or''/''optional'' hedge, a stated Dual/Tri/Quad-Band count must equal the radios listed). Lists: NETGEAR ''WiFi Bands'' / ''Simultaneous Dual-Band WiFi ...'' rows of the two-cell spec table (every band row of the page must be such a list; an MLO or beamforming row can only say True); ASUS ''Operating Frequency''; TP-Link ''Frequency'', or a ''WiFi Speeds'' row whose per-band rates sum to its class number within 3 % (BE3600 = 2882 + 688), so no radio is missing. The False claim carries condition basis=complete_enumeration (routers profile basis_condition) and keeps the list as raw. True is also read from NETGEAR band rows naming 6 GHz (Orbi 770/870/970, RS300-RS700S) and a TP-Link ''Frequency'' row. NETGEAR ''WiFi Bands'' rows also give per-band rates and NxN streams (RS150 ''5 GHz (3x3), 4.3 Gbps''); their ''160 to 20 MHz'' widths are not read; where the table row has no rates they come from the page''s own product-attribute record (c_wifiBands, only the record whose nearest c_modelNumber is the page model, one distinct value), e.g. RS300 ''5GHz (2x2), 2.9Gbps'', RBE870 ''5 GHz (4x4/240 MHz): 8,640 Mbps''. All other claims are byte-identical to @2 output.'
  audit:
    by: A2 preset fill
    at: '2026-11-24'
    evidence: 'team/reports/2026-11-24-a2-preset-fill.md; claim diff over every stored snapshot, frozen pre-edit copy of crawler/ vs new parsers: tplink +52 has_6ghz=false, asus +64 has_6ghz=false (Operating Frequency), netgear +21 has_6ghz=true, +8 has_6ghz=false, +12 rate_5, +1 rate_5_2, +11 rate_24, +7 rate_6, +11 streams_5, +10 streams_24, +7 streams_6; 0 removed, 0 changed. Fixtures tests/test_preset_fill_routers.py (positive, complete-enumeration false, refused).'
    parsers:
