- id: rel/bundle-contents@2
  since: '2026-11-23'
  supersedes: rel/bundle-contents@1
  rationale: 'Review 4 fix 1. contains links minted by the shared transform scripts/bundles.py bundles@2, pinned here by fingerprint (audit.parsers
    bundles@2; a code change is parser drift, fatal under --strict-parsers) and by the link parser "<adapter>@N+bundles@2", which @1 never
    matches (@1 is inert). Evidence level stated: the manufacturer store listing that itemises the SKU (one listing can mint; several must agree,
    which is consistency, not independent corroboration). No SKU-digit inference; the page model must be named, a capacity note must equal the
    page''s own capacity; colour slashes only from a reviewed list; pipe tails kept as unparsed (contents incomplete); both free syntaxes are
    promotions (dated, never contents); pack words fabricate no component; 0 quantities rejected; exact multisets of member models and full
    descriptions (plural folding only); one stated market; punctuation-variant, disputed or unparseable SKUs are quarantined in
