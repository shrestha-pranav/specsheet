- id: claim/cpsc-recalls@1
  since: '2026-11-26'
  rationale: 'A2-safe r12 (brief coord-2026-11-26-r12, lane A2-safe; coordinator ruling r12 on recall-only records). New cross-brand regulatory
    overlay: U.S. CPSC Recalls REST API (www.saferproducts.gov/RestWebServices/Recall, one GET per recall year through crawl.Net, robots +
    terms read first, source-policy 2026-11-26.12), one registry source per model-importer category (cpsc-recalls-<category>), one adapter
    crawler/adapters/cpsc_recalls.py. A recall is attached ONLY to a model number the notice prints after a model lead (model / models /
    model number(s) X, Y and Z) or, for a model some maker or certifier source already lists, anywhere in the notice text, matched exactly
    (import.py mfr_model normalisation) for a brand the notice names. Never by prefix ("model numbers beginning with"), model series,
    wildcard, a sentence with a negation (not / no other / excluded / except), or a model split by a stray space. The product type of the
    phrase before the lead picks the category (charging stand -> chargers, power bank -> power-banks). With no existing entity, a single
    named brand mints a recall-only record (identity + recall facts only) flagged gen.record_kind recall_only; a notice naming several
    brands, or a notice whose title says Commercial, mints nothing. Values: safety.recall = "CPSC <number> (<date>): <hazard sentence>" per recall, safety.recall_id the recall
    numbers, safety.recall_date the latest recall date, safety.recall_remedy the RemedyOptions (replace / refund / repair / ...),
    safety.recall_url the notice on www.cpsc.gov. Nothing here writes a negative: no recall listed is unknown.'
  audit:
    by: A2-safe r12
    at: '2026-11-26'
    evidence: 'team/reports/2026-11-26-A2-safe-r12.md; raw/cpsc-recalls (22 year pages 2005-2026, 7,201 recalls); tests/test_a2_safe_r12.py'
    parsers: {'cpsc_recalls@1': 'sha256:96b2f1dd427b733c86e3'}
