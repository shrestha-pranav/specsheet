  supersedes: claim/mfr-routers-structured@1
  rationale: 'Wi-Fi routers/mesh, manufacturer-owned spec tables: TP-Link US product + support pages (tplink_routers@1), NETGEAR US product pages (netgear_routers@1),
    ASUS US techspec tables (asus_routers@1). Per field: only the listed keys, only values that normalise to the profile type. Per-band rates and streams
    come from text segments that start at a band marker, never from the class number (AX5400); widths 320 MHz only with a 6 GHz radio; stream counts only
    from an explicit NxN. Fetch-time facts (id.msrp_us, sup.latest_firmware_date), the free-text fields (antennas, QoS, power input) and anything the pages
    do not state (SoC vendor/model, FCC ID, support end date) are NOT accepted: preview candidates or absent. gen.device_type / gen.product_line are accepted
    only for TP-Link and ASUS (URL section), see claim/mfr-routers-class@1. @2: re-issued because @1 was edited in place (key list sup.hardware_versions
    -> sup.hardware_version, REV report) and its parser tplink_routers changed meaning under @1 (default-revision facts moved to the revision entity); tplink_routers
