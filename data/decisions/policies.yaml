- id: claim/derive-samsung-sfc2-pps@3
  since: '2026-11-26'
  supersedes: claim/derive-samsung-sfc2-pps@2
  rationale: 'Coordinator ruling r7 (brief coord-2026-11-26-r7-powerbanks): Samsung Super Fast Charging 2.0 is PPS by definition. When the maker''s own
    page for the SKU names ''Samsung Super Fast Charging 2.0'' or ''45W (max) (output) for Samsung'' (not negated) and the page wrote no stated pd.pps claim,
    the adapter writes pd.pps true, kind derived, condition basis=derived (research/power-banks/spec-profile.yaml), quote ''rule r7-sfc2 ...''. Never false,
    never a PPS voltage/current range. Rule code: crawler/adapters/pb_pps_r7.py sfc2()/add_derived(), called by anker_powerbanks@6 (product prose + the
    page''s own htmlContainer notes) and by iniu_powerbanks@6 / cuktech_powerbanks@6 (page text). Plain ''Samsung Super Fast Charging'' without 2.0 (Anker
    A1657) writes nothing. An official claim on the same product wins (resolve.py kind order). @2 (A3-fix, Codex review-9 P1-2): the derivation needs an
    affirmative own-product OUTPUT sentence: the whole sentence naming SFC 2.0 / 45W for Samsung must carry an output verb (supports / delivers / outputs
    / provides / compatible) and no negation anywhere, no question (trailing ?, leading does/can/is.., FAQ Q:), no input / recharge / adapter / charger
    context, no other-product wording (other / another / previous / unlike / vs) and no model token other than the page model (target phones Galaxy/iPhone/Pixel
    N excepted). Still kind derived, basis derived, never a PPS range. @3 (A3-fix, Codex review-10 P1-2): negation also covers modal and contraction forms (cannot, can''t, won''t, isn''t, unable, incompatible, never, lacks; any apostrophe), and every model token in the sentence must EQUAL one of the page''s own identities after normalisation (mfr_model, mfr_sku and the model tokens printed inside them): no substring match, so ''The P730 supports ...'' is foreign for P73. Still kind derived, basis derived, never a PPS range.'
