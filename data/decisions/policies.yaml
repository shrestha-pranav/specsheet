    116) with a compliance record in status 2 (certified) and a certificate id (csa_dcl_robovac@2). Rows are attached only to a US-store model of the same
    brand whose name matches the ledger productName exactly after normalisation (no new US models from ledger names). Only true is ever claimed: a registered-but-uncertified
    model is an absence, never false. @2 (review 3): parse re-checks on the stored ledger row that productName minus the brand word equals the store model
    exactly (discovery did this only once); any mismatch is an absence. This is the ONLY policy that trusts smart.matter (claim/mfr-robovac-structured@5
