- id: claim/document-power-pdo@1
  since: '2026-11-24'
  rationale: 'New pseudo-source documents (crawler/documents.py + scripts/docattach.py, transform docattach@1): the PDF manuals / QSGs /
    datasheets a charger or power-bank maker page links, read from their TEXT LAYER (pdftotext -layout / -bbox-layout column blocks). OCR claims
    (extractor docparse-ocr@1) are NOT covered: they stay candidates (preview) with conditions {ocr: true, ocr_conf}. Identity guard: a document
    attaches only to an entity observed on the linking page AND only when the document text names one of that entity''s own mfr_model / mfr_sku
    exactly; a multi-model document attaches only claims read from a block naming the model; everything else is a document_proposal event.
    Keys: pd.pps (True only: a printed PPS range in an output row, or an explicit "Supports PPS" / protocol list naming PPS), pd.pps_max_voltage /
    pd.pps_max_current_a (highest printed PPS range of single-port or sectionless output rows; chargers), pd.max_fixed_voltage (highest
    printed fixed PDO of output rows), pd.epr (True only, fixed PDO >= 28 V; chargers), out.ports (only rows the document names explicitly in a
    single-port or sectionless output table, mapped onto the linking page''s own port rows by exact port token cover; combination / "N ports in
    use" rows never set a port; a PDO line naming no port sets device-level keys only). Conditions {document_kind} are provenance only
    (scripts/resolve.py PROVENANCE): page and document agreeing = one value, disagreeing = conflicted (visible), page rows are completed
    from compatible document rows only where the page left the field empty (resolve.py item merge, note "merged: ...").'
  audit:
    by: A3 document pipeline
    at: '2026-11-24'
    evidence: 'team/reports/2026-11-24-document-pipeline.md; tests/test_documents.py (A2667 manual: PPS 3.3-16V 3.25A on USB-C 1 and USB-C 2 from
