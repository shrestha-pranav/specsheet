  rationale: 'Review 6 (reviews/2026-11-24-astra-review-6-docs.md) reissue of @3 for transform docattach@2 / extractor docparse@2. Same source,
    keys, kinds and tiers; acceptance only narrows. (1) Identity: a claim is accepted only when its own row scope (the block, else the page, else
    the whole document when the document names no other model) names this entity and no sibling; siblings include UNCATALOGUED models (same
    identifier shape, or any token after a model label) and catalogued same-brand entities outside the entity''s own lineage; a block or page
    naming two models scopes nothing. Identity evidence must be text layer: OCR identity, even with text-layer rows, makes the claim
    OCR-dependent (docparse-ocr@2, never accepted), and an OCR mention counts only when its own words have token confidence >= 60 (the page
    mean never vouches). A model-level match with another SKU of the same base model, a foreign region token in the file name, or an identifier
    shared with an unrelated entity is variant-unestablished (docparse-review@2, never accepted) unless the scope names an own SKU. Conditions
    carry identity, identity_scope, identity_variant (provenance only). (2) Combination context (multi-port headings, "C1 + C2" prefixes) is
    document scope across block and page boundaries; per-port rows and device maxima never come from inside it. Port rows map only onto the
    out.ports claim of the linking observation itself; when the entity''s pages disagree on the port layout only explicit single-port rows are
    attributed. (3) One source entry, claim (locator.linked_from) and documents[] entry per verified linking edge; the source policy inherits
    only along that edge.'
