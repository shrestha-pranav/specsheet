    (target energystar-tvs:<pd_id>), method es-scope:documented only: the whole model key matches the basic or an exactly declared pattern
    with the documented "*" = one alphanumeric, same brand, record states United States and the model key states US, sizes agree, record
    dated, no disagreeing overlapping record. Not covered (stay proposals): es-scope:undocumented-wildcard, es-scope:listed-undeclared,
    es-scope:declaration-not-exact, es-scope:conflict. The edge is coverage only: no parent, alias, merge or inheritance.'
