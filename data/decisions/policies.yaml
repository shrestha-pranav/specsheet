  rationale: 'New source aoc-us-monitors (crawler/adapters/aoc_monitors.py, A2-mon r8 brief coord-2026-11-26-r8-monitor-makers): the spec accordion of www.aoc.com /us/monitors/<slug> and /us/gaming/monitors/<slug> product pages, discovered from https://www.aoc.com/sitemap-en-us.xml (177 product URLs, category-* listings skipped). www.aoc.com added to data/source-policy.yaml 2026-11-26.3 (maker, crawl agent; robots.txt * Allow /; /us/legal-disclosure has no automated-access clause, its "permanent storage ... of the pages is prohibited" line is a to_clear and the fetcher stores only the spec excerpt). One page = one model: mfr_model = the schema.org Product model, which must equal the URL slug (the <title> is never used: 22B30H3 is titled 24B3HM). Rules: res.refresh_max = the Max Refresh rate row; res.refresh_native = the explicit "N Hz Native" figure of an OC row ("260Hz (OC, 240Hz Native)"), or the single plain "N Hz" row only when no row, title or JSON-LD name/description says OC / overclock / dual mode and no Hz figure there exceeds N (signal-frequency rows excluded); a higher figure elsewhere ("144Hz/OC 180Hz" copy on a 144 Hz row) withholds both keys; "180Hz OC" writes max only. flk.pwm none ONLY from the Flicker-Free row reading Flicker Free / TUV Flicker Free / Yes ("No", Anti Blue Light and silence write nothing). vin.hdmi_count / vin.dp_count = the sum of the per-item counts of the HDMI / DisplayPort rows, only when every item prints a count and none is an output / daisy-chain item; vin.hdmi_version only when one version is named. usb.usbc_inputs only from the USB-C connectivity row via _monports (ambiguous, e.g. "USB-C (PD 90W) x 1" or "USB-C x 2", writes nothing); never 0 (U27U2DP advertises USB-C docking with no USB-C connectivity row, so the Connectivity section is not a complete enumeration); usb.usbc_pd_w only from that row when it is a video input with one W figure; usb.usbc_alt_dp via _monusb; usb.kvm True only from a KVM row naming ports or Yes. panel.technology from Panel type (QD-OLED from "QD - OLED" or OLED + Backlight QD OLED; bare OLED writes nothing). Size class as stated when whole, else derived by size_class_round_half_up@1.'
