- id: claim/mfr-power-banks-structured@4
  since: '2026-11-23'
  supersedes: claim/mfr-power-banks-structured@3
  rationale: 'Power banks, manufacturer-owned spec tables: ONE consolidated policy for all nine US stores (Anker, Belkin, INIU, CUKTECH, UGREEN, EcoFlow,
    SHARGE, KUXIU, mophie), replacing the overlapping @2/@3 (kept in claim_policies only because tests/test_adversarial.py requires retired ids to be @1;
    they match only the @1 extractor versions, which no longer exist in code, so they accept nothing). Review 3 parser changes, every extractor version-bumped:
    (1) out.max_total_w = ALL-PORTS simultaneous output only: the maker''s labelled Total Output row, or a printed combination whose members each name one
    port and together cover every individual port of the block; subset totals, ''&'' without ''+'' combinations, unprinted sums (''65W+15W''), a single
    listed port and mode-dependent totals become status-unknown claims (literal + reason); the participating ports are quoted. (2) Capacity bases stay apart:
    Anker title capacity -> cap.class_mah (not accepted: title-derived), never cap.cell_mah; a capacity row printing a 5 V basis, two unlabelled mAh or
    Wh figures, and a rated row without its load are unresolved; cap.rated_mah carries conditions {rated_voltage_v, rated_current_a} (profile basis conditions).
    (3) INIU/UGREEN page-vs-label identity conflicts (handle token, SKU model tokens, ''+'' bundle SKUs, edition suffix) are quarantined to identity_conflicts
    when another page owns the model, else kept and listed; SKUs naming another INIU model are dropped as aliases. Per-source keys = @3 unchanged. Belkin''s
    title capacity class (cap.class_mah) remains the one intentional title-derived key: it is a class, labelled as such, never cell mAh.'
