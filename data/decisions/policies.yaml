  rationale: 'New transform docspec-attach-r3@1 (scripts/docspec_r3.py; extractors docspec-tv@1, docspec-router@1, docspec-laptop@1 in
    crawler/adapters/_docspec_{tv,router,laptop}.py). Maker spec sheets linked from a registered maker page the entity is observed on (edge
    verified as docattach@2). Identity = docspec-attach@2 rule unchanged: the text quotes an own mfr_model / mfr_sku (or its 6+ char base SKU),
    and no same-brand catalogued model outside the linking pages is named (multi_model_other_page); quoted identifiers ride on
    locator.identifiers. Cells: adjacent (label, value) segments of a pdftotext -layout line; a value repeated in the next column (per-size
    table) or a size-qualified cell is never read; one key with two values in a document reads nothing. Affirmative only: hdmi.has_4k120 needs
    HDMI 2.1 AND a 4K>=120Hz figure in the same cell; ports_4k120 only from "<N>x HDMI 2.1 (4K@...)" with no other HDMI version; refresh.native_hz
    only from a native/panel refresh label (or LG "TruMotion N (Refresh Rate 60Hz)"), never TruMotion/MCI numbers; lcd_type never from brand
    panel names (HVA/WHVA); mem.soldered needs a slot statement (ASUS trap); no false/zero from silence. Text layer only.'
  audit:
    by: A3-docs-2 r3
    at: '2026-11-25'
    evidence: 'team/reports/2026-11-25-a3-docparsers-r3.md; tests/test_docspec_r3.py (per category: corroborating claim, new fill, wrong-model
      document linked from its page attaches nothing; unlinked same-brand model blocks); replay over every stored TV / router / laptop document.'
    parsers:
