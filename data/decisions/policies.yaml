# Versioned auto-accept policies (scripts/decisions.py; ARCHITECTURE 15.8). Changing what a policy accepts = new id (@N+1), never an edit.
# A claim accepted by a policy publishes in the trusted index with review.by = <policy id>. Everything else is a candidate
# (preview dataset only) until a human ledger line (ledger.jsonl) accepts or rejects it.
format: specsheet.policies/1
claim_policies:
  - id: claim/mfr-structured-datasheet@1
    since: "2026-11-22"
    rationale: >-
      Deterministic extraction of the manufacturer's own structured specification data: Lenovo PSREF model tables
      (adapter + psref-mapping single-target columns), Tripp Lite product JSON/datasheet tables, CyberPower item JSON + datasheets,
      and label-mapping transforms applied to those two manufacturers' labelled tables. Values must normalise to the profile type
      (normalize.py) or the claim stays a candidate. Adapter versions are pinned: a parser bump needs a re-audit and a policy @N+1.
    audit: "A2 round 2/3 fixture re-parse (0 diffs) + A3 spot check of literal vs normalised values, 2026-11-22"
    match:
      extractors: [lenovo_psref@2, import.py+psref-mapping@1, tripplite@2, cyberpower@1, import.py+label-mapping@1]
      source_ids: [lenovo-psref, tripplite, cyberpower]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      require_normalized: true
      exclude_keys: []
  - id: claim/asus-techspec-typed@1
    since: "2026-11-22"
    rationale: >-
      ASUS techspec tables (asus@1): labelled manufacturer cells, but model-level pages often append option notes and
      disclaimers. Only values that normalise to a typed profile value (number/integer/bool/enum), plus the processor,
      colour, webcam and OS cells (single literal statements), are accepted; other free text stays a preview candidate.
    audit: "A3 spot check of 25 random asus@1 claims (raw vs normalised), 2026-11-22: 0 wrong typed values"
    match:
      extractors: [asus@1]
      source_ids: [asus-us]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      spec_types: [number, integer, bool, enum]
      also_keys: [cpu.model, gen.color, in.webcam, sw.os]
      require_normalized: true
  - id: claim/cpu-split@1
    since: "2026-11-22"
    rationale: >-
      import.py splits a processor cell (crawler/adapters/_cpu.py) into model/cores/threads/clocks/cache. A split claim is only
      accepted when the literal claim it derives from is accepted (checked in import.py), so this policy never widens trust.
    match:
      extractors: [import.py+cpu-split@1]
      kinds: [official]
      require_normalized: true
  - id: claim/mfr-monitor-structured@1
    since: "2026-11-23"
    rationale: >-
      Monitors, manufacturer-owned structured pages: Lenovo PSREF monitor platform tables (lenovo_monitors@1), LG US product JSON
      (lg_us@1 next_data terms) and ASUS US techspec tables (asus_monitors@1). Per field: only values that normalise to the profile type
      (normalize.py) are accepted; labels A2 recorded as unmapped (ASUS "1ms MPRT" is not GtG) never become claims, so nothing mapped
      here is a guess. Manufacturer-marketed values (motion.gtg_marketed, hdr.peak_marketed, hdr.marketed_label) are accepted AS
      marketed claims (the keys say so). Adapter versions pinned.
    audit: "A2 monitors r2 report (5 adapters parsed, mapping caveats listed) + A3 per-source spot check, 2026-11-23"
    match:
      extractors: [lenovo_monitors@1, lg_us@1, asus_monitors@1]
      source_ids: [lenovo-psref-monitors, lg-us, asus-us-monitors]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      require_normalized: true
  - id: claim/energystar-certified-power@1
    since: "2026-11-23"
    rationale: >-
      ENERGY STAR product-finder rows (energystar_monitors@1) are the EPA certification record for the maker's own model string.
      Accepted per field: the measured/declared power fields, the certification flag, native resolution and viewable diagonal.
      NOT accepted (stay preview): luminance (basis unstated), contrast (<100 dropped by the adapter, basis unstated), panel
      technology and release year (certification date is not release date).
    audit: "A2 monitors r2 mapping caveats; A3 check that pwr.* normalise to the profile unit, 2026-11-23"
    match:
      extractors: [energystar_monitors@1]
      source_ids: [energystar-monitors]
      kinds: [official]
      tiers: [regulatory]
      statuses: [known, not_applicable]
      keys: [pwr.typical, pwr.standby, pwr.external_adapter, pwr.energy_star, res.native, res.width_px, res.height_px, gen.viewable_diag]
      require_normalized: true
  - id: claim/displayhdr-certified-tier@1
    since: "2026-11-23"
    rationale: >-
      VESA's DisplayHDR certified-products table (displayhdr@2) is the certification record: tier (400..1400, True Black) for a
      listed model. Accepted as a certification claim on the model it names; a stem-only (non-exact) model match does NOT transmit it.
    audit: "A2 monitors r2: 2129 rows parsed, tier distribution checked against the page, 2026-11-23"
    match:
      extractors: [displayhdr@2]
      source_ids: [displayhdr]
      kinds: [official]
      tiers: [certifier]
      keys: [hdr.vesa_tier]
      statuses: [known]
      require_normalized: true
  - id: claim/mfr-ssd-structured@1
    since: "2026-11-23"
    rationale: >-
      Consumer SSDs, manufacturer-owned pages: SanDisk/WD product pages (sandisk_ssd@1) and the TEAMGROUP per-capacity tables
      (teamgroup_ssd@1). Per field: only the listed keys, only values that normalise to the profile type. Rated sequential speeds
      are the maker's "up to" figures and are accepted AS conditioned claims (adapter attaches cache_state=in_slc_cache, the profile
      headline condition), never as sustained speeds; the post-cache speed and SLC cache size are not on these pages and stay absent.
      NOT accepted (preview candidates): id.msrp_us (price at fetch time) and anything not listed (e.g. unmapped labels, certifications).
    audit: "A2 ssds report (parse + reparse verified, enum/number types validated over every claim) + A3 per-key counts and spot check, 2026-11-23"
    match:
      extractors: [sandisk_ssd@1, teamgroup_ssd@1]
      source_ids: [sandisk-us-ssd, teamgroup-us-ssd]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      keys: [gen.capacity, gen.device_class, gen.form_factor, gen.weight, if.pcie_gen, if.pcie_lanes, if.protocol, if.nvme_version, if.usb_standard, if.usb_connector, hw.controller, hw.controller_vendor, hw.dram_type, hw.dram_size, hw.dram_gen, hw.nand_type, hw.nand_vendor, perf.seq_read, perf.seq_write, perf.rand_read_iops_qd1, perf.rand_read_iops_qd32, perf.rand_write_iops_qd1, perf.rand_write_iops_qd32, end.tbw, end.warranty_years, end.mtbf, pwr.idle_mw, pwr.l1_2_mw, sec.encryption, therm.temp_operating, port.drop]
      require_normalized: true
  - id: claim/mfr-ssd-samsung@1
    since: "2026-11-23"
    rationale: >-
      samsung.com/us spec API (samsung_ssd@1), same per-field rule and "up to" speed conditioning as claim/mfr-ssd-structured@1, but
      gen.capacity is NOT accepted: A2 found a real page defect (990 PRO 2TB heatsink row states 1TB), so capacity stays a candidate
      until a human accepts it or the adapter derives it from the part number. id.msrp_us stays a candidate (price at fetch time).
    audit: "A2 ssds report (Samsung page/API defects listed) + A3 per-key counts, 2026-11-23"
    match:
      extractors: [samsung_ssd@1]
      source_ids: [samsung-us-ssd]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      keys: [gen.device_class, gen.form_factor, gen.weight, if.pcie_gen, if.pcie_lanes, if.protocol, if.nvme_version, if.usb_standard, if.usb_connector, hw.controller, hw.controller_vendor, hw.dram_type, hw.dram_size, hw.dram_gen, hw.nand_type, hw.nand_vendor, perf.seq_read, perf.seq_write, perf.rand_read_iops_qd1, perf.rand_read_iops_qd32, perf.rand_write_iops_qd1, perf.rand_write_iops_qd32, end.tbw, end.warranty_years, end.mtbf, pwr.idle_mw, pwr.l1_2_mw, sec.encryption, therm.temp_operating, port.drop]
      require_normalized: true
  - id: claim/mfr-routers-structured@1
    since: "2026-11-23"
    rationale: >-
      Wi-Fi routers/mesh, manufacturer-owned spec tables: TP-Link US product + support pages (tplink_routers@1), NETGEAR US product pages (netgear_routers@1),
      ASUS US techspec tables (asus_routers@1). Per field: only the listed keys, only values that normalise to the profile type. Per-band rates and
      streams come from text segments that start at a band marker, never from the class number (AX5400); widths 320 MHz only with a 6 GHz radio; stream counts
      only from an explicit NxN. Fetch-time facts (id.msrp_us, sup.latest_firmware_date), the free-text fields (antennas, QoS, power input) and anything the
      pages do not state (SoC vendor/model, FCC ID, support end date) are NOT accepted: preview candidates or absent.
      gen.device_type / gen.product_line are accepted only for TP-Link and ASUS (URL section), see claim/mfr-routers-class@1.
    audit: "A2 routers report: 106 TP-Link, 60 NETGEAR, 82 ASUS pages parsed; spot check of deco-be25, archer-be800, rbe972sb, rt-ax86u-pro, xt8 (raw vs normalised), 2026-11-23"
    match:
      extractors: [tplink_routers@1, netgear_routers@1, asus_routers@1]
      source_ids: [tplink-us-routers, netgear-us-routers, asus-us-routers]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known, not_applicable]
      keys: [gen.pack_count, wifi.generation, wifi.marketing_class, wifi.band_count, wifi.has_6ghz, wifi.rate_24_mbps, wifi.rate_5_mbps, wifi.rate_5_2_mbps, wifi.rate_6_mbps, wifi.streams_24, wifi.streams_5, wifi.streams_5_2, wifi.streams_6, wifi.max_width_5_mhz, wifi.max_width_6_mhz, wifi.qam_max, wifi.mlo, wifi.mu_mimo, wifi.ofdma, wifi.wpa3, hw.cpu_cores, hw.cpu_ghz, hw.ram_mb, hw.flash_mb, port.wan_speed_mbps, port.wan_type, port.lan_count, port.lan_max_mbps, port.multigig_count, port.wan_lan_configurable, port.usb_count, port.usb_standard, mesh.supported, mesh.systems, mesh.coverage_sqft, sw.vpn_server, sw.vpn_client, sw.wireguard, sw.operating_modes, sw.parental_controls, isp.ipv6, phys.weight, phys.dimensions, sup.hardware_version]
      require_normalized: true
  - id: claim/mfr-routers-class@1
    since: "2026-11-23"
    rationale: >-
      Device class and product line derived from the manufacturer's own URL section (TP-Link wifi-router vs deco-mesh-wifi, ASUS wifi-routers vs
      whole-home-mesh-systems and the asus-zenwifi / asus-gaming-routers group). NETGEAR is excluded: its class comes from a model-prefix heuristic
      (rbs = satellite) and stays a preview candidate.
    audit: "A2 routers report, URL sections listed in the adapters' discover docstrings, 2026-11-23"
    match:
      extractors: [tplink_routers@1, asus_routers@1]
      source_ids: [tplink-us-routers, asus-us-routers]
      kinds: [official]
      tiers: [manufacturer]
      statuses: [known]
      keys: [gen.device_type, gen.product_line]
      require_normalized: true
relation_policies:
  - id: rel/source-stated-hierarchy@1
    since: "2026-11-22"
    rationale: >-
      The manufacturer source itself states the link: PSREF lists each MTM under its machine type and product, ASUS/Dell/
      Surface/Framework/Samsung/Razer pages list the part number under the model, a crawl-brand page lists its own colour SKUs.
      Suffix-inferred links (suffix:*) are NOT covered: they stay proposed until a human approves them in ledger.jsonl.
    methods: ["adapter:*", "page-variants:*"]
    types: [member_of_family, configuration_of, package_of, variant_of]
