- id: claim/mfr-laptop-ports@2
  since: '2026-11-26'
  supersedes: claim/mfr-laptop-ports@1
  rationale: 'New (A2-lap r8 brief item 1): per-port USB-C facts from the maker''s own port list for Dell (dell@2, www.dell.com spd Tech Specs ''Ports'' list, default configuration of the platform) and Microsoft Surface (surface@2, learn.microsoft.com tech-spec ''Ports and charging'' row), parsed by crawler/adapters/_xports.py in the Lenovo _lports per-port model. Each fact only from the line that states it, never pooled: one item per physical USB-C port; usb_gbps from one printed figure (''80/120 Gbps'' = none); dp_alt only when the port line names DisplayPort (Surface: also its own ''with support for:'' sub-items or an ''All USB-C ports support ...'' line; a separate ''DisplayPort 2.1 with support for monitors'' line is not attributed); pd_in_w only from a printed ''N W charging''; tb_usb4 = highest TB5 > TB4 > USB4 on a USB-C line; video_out = dedicated HDMI lines, literal; charge_port: Dell ''barrel power port'' = barrel, Surface Connect = proprietary, usb-c only when a USB-C line or charging line states charging over USB-C and no other charge path is named (Surface Connect + USB-C = nothing; Dell ''power-adapter port'' of unstated shape = nothing). Whole list refused on any platform/config condition (''AMD Ryzen 200 Series:'', ''only for computers with'', ''OR'', ''(optional)''), unknown line, or Surface size sections that disagree. Dell bare ''USB 3.2 Gen 1 (5 Gbps) port'' lines are read as non-USB-C (Dell names every Type-C port explicitly). r9: port.charge_port gains the value dedicated (A1 ruling): the maker''s port list names a separate DC-in / power-adapter / power connector of unstated shape; never inferred from absence of USB-C charging. Dedicated + USB-C charging both stated -> list [dedicated, usb-c].'
