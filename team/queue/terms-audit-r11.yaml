# Terms audit r11 (A5), brief team/briefs/coord-2026-11-26-r11-terms-audit-a5.md. PROPOSALS ONLY: the coordinator
# applies them to data/source-policy.yaml (A5 did not edit it). Against policy_version 2026-11-26.9.
# Scope: every crawl:agent (or crawl-absent) domain with evidence none/search. Hosts already handled by A2-chg/A2-bat
# in .7/.9 (belkin, s3.belkin, choetech, hypershop, aukey, plugable, nekteck, satechi, baseus, kuxiu, nativeunion,
# mophie) are left out.
# Method 2026-11-26: robots.txt + homepage + terms pages fetched with the crawler UA
# (crawler/crawl.py UA, specsheet-crawler/0.1), >=1.1 s between requests per host, robots checked before each page.
# Any 403/WAF challenge = blocked, no other fetcher used. The one exception is TP-Link: WebSearch was used only to
# find the URL of its terms page, and the page itself was fetched with our UA.
# basis: A = terms bar robots/scraping/automated collection (the LG/Samsung/Apple standard)
#        B = the site licence limits access to or use of the site/content to personal non-commercial use (the
#            se.com/apc 2026-11-26.2 and satechi .9 standard). A download/print-only clause stays agent (mophie .9 precedent).
#        R = robots.txt names Claude*/anthropic* or ClaudeBot with Disallow: / (ViewSonic/Bissell precedent)
#        X = blocked (403 / WAF challenge / unreachable)
# published_values = spec values citing the host in docs/api/v1/*/products/*.json at audit time.
