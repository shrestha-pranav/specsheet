name: Dishwashers
description: "US dishwashers by maker model number (Bosch SHP78CM5N, Samsung DW80B7070US/AA) and by ENERGY STAR certified pattern (one DOE
  basic model covering several finishes, shown as its own row and flagged): standard vs compact, width and depth, place settings, annual
  kWh and gallons per cycle under the DOE test procedure, % below the federal standard, tub, drying system, soil sensor, connected. Noise
  (dBA) is a maker-only figure and has no source yet. Source: ENERGY STAR Certified Residential Dishwashers (U.S. EPA). Absent from
  ENERGY STAR = unknown, never 'not certified'."
columns: [dims.width_in, capacity.place_settings, energy.annual_kwh, water.gal_per_cycle, noise.dba, cert.energy_star]
# r11 A2-appl: same pattern-entity and coverage rules as refrigerators (scripts/escover.py).
