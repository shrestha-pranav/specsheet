  level: model
  sources:
  - Derived; Dell lists
  example: 109
- key: res.aspect
  label: Aspect ratio
  group: res
  type: enum
  unit: null
  tier: important
  facet: true
  why: Ultrawide
  level: model
  sources:
  - Manufacturer spec page
  example: '16:9'
  enum:
  - '16:9'
  - '16:10'
  - '3:2'
  - '21:9'
  - '32:9'
  - '4:3'
  - other
  enum_open: true
- key: res.refresh_native
  label: 'Refresh rate: native (no overclock)'
  group: res
  type: number
  unit: Hz
  tier: core
  facet:
    kind: range
    bins:
    - 60
    - 75
    - 120
    - 144
    - 165
    - 240
    - 360
    - 480
    column: true
  why: Marketed number often includes OC
  level: model
  traps:
  - Listed 'OC' ('165Hz OC') = native 144; may not work on all inputs
  sources:
  - Manufacturer spec page
  example: 240
  required: true
- key: res.refresh_max
  label: 'Refresh rate: max (incl OC)'
  group: res
  type: number
  unit: Hz
  tier: important
  facet: false
  why: Marketed headline
  level: model
  traps:
  - Can need DP only / lower color depth
  sources:
  - Manufacturer spec page
  example: 240
- key: res.refresh_dual_mode
  label: Dual-mode (resolution/refresh switch)
  group: res
  type: list
  unit: null
  tier: important
  facet: false
  why: e.g. 4K 240 / FHD 480 modes
  level: model
  traps:
  - Second mode usually reduced resolution; UI hidden in OSD
  sources:
  - Manufacturer spec page
  example:
  - 4K@240
  - FHD@480
  items: text
- key: res.vrr_types
  label: VRR support
  group: res
  type: list
  unit: null
  tier: core
  facet:
    kind: multi
  why: FreeSync / G-Sync / Adaptive-Sync
  level: model
  traps:
  - '''G-Sync Compatible'' certification varies by revision; true G-Sync (module) is a different product'
  - '''FreeSync'' alone = no LFC guarantee'
  sources:
  - Manufacturer spec page
  example:
  - FreeSync Premium Pro
  - G-Sync Compatible
  items: enum
- key: res.vrr_range
  label: VRR range (min-max Hz)
  group: res
  type: range
  unit: Hz
  tier: important
  facet: false
  why: Low end flicker / LFC
  level: model
  traps:
  - Range often per input; OLED VRR flicker below ~80 Hz
  sources:
  - AMD FreeSync page; NVIDIA list; RTINGS
  example:
  - 48
  - 240
- key: res.hdmi_vrr_ok
  label: VRR over HDMI
  group: res
  type: bool
  unit: null
  tier: detail
  facet: false
  why: Consoles
  level: model
  sources:
  - Manufacturer spec page
  example: true
- key: motion.gtg_marketed
