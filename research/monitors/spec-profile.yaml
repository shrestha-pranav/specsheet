  - GtG
  - MPRT
  - unspecified
  - BtW
  - Fast mode GtG
  - Normal mode GtG
  - other
  enum_open: true
- key: motion.gtg_measured
  label: Measured avg GtG
  group: motion
  type: number
  unit: ms
  tier: important
  facet: false
