  - 6-bit+FRC
  - 8-bit
  - 8-bit+FRC
  - 10-bit
  identity_role: none
- key: panel.color_depth_marketed
  label: Marketed color count
  group: panel
  type: enum
  unit: null
  tier: detail
  facet: false
  why: Cross-check bit depth
  level: model
  sources:
  - Manufacturer spec page
  example: 1.07B
  enum:
  - 16.7M
  - 1.07B
  - other
  enum_open: true
- key: panel.viewing_angle
  label: Viewing angle H/V
