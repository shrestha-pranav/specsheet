profile_format: specsheet.category-profile/1
category: monitors
version: 0.2.0
label: Computer monitors
market: US
status: draft
scope: Standalone computer monitors (IPS/VA/TN/OLED/Mini-LED), gaming, office, creator, portable, ultrawide. Excludes TVs,
  laptop panels, all-in-ones.
identity:
  levels:
  - level: family
    label: Product line
    meaning: e.g. LG UltraGear OLED 27GR95; Dell UltraSharp U32xx
    key_schemes:
    - mfr_family
    inherits: false
  - level: model
    label: Model number
    meaning: Marketed model incl. suffix (27GR95QE-B, U3224KB, LS27DG602SNXZA)
    key_schemes:
    - mfr_model
    inherits: true
  - level: revision
    label: Hardware revision
    meaning: Silent board/panel/firmware change under the same model number (rear label REV, panel part, EDID product ID)
    key_schemes:
    - hw_rev
    - edid_id
    inherits: true
  - level: package
    label: Orderable SKU / regional package
    meaning: Dell 210-xxxx, retailer or region code, color; GTIN
    key_schemes:
    - mfr_sku
    - gtin
    inherits: true
  primary_key: Manufacturer model number INCLUDING regional/market suffix (LG -B, Samsung trailing region letters like ZA/XZA,
    Dell orderable 210-code); when a hardware revision is known, (model, hw_rev). Retail titles are aliases only.
  per_brand:
    dell: Model U3224KB / S2725DS; orderable SKU 210-BHBZ; rear label REV A0x (hw revision)
    lg: Model e.g. 27GR95QE-B; -B = US market/black, suffix varies by region (e.g. 27GR95QE-B.AUS)
    samsung: LS27DG602SNXZA (LS + size/line + trailing region code; XZA = US); sometimes pure 'G60SF' family name
    asus: PG27AQDM; retailer SKUs 90LM0..; Ver. on label
    msi: MAG 274QRF QD E2; E2 = revision/generation suffix
    gigabyte: M32U; 'rev. 1.0/2.0' on box
    benq: EW3280U; MOBIUZ EX2710Q; 9H.xxxxx.xxx SKUs
    viewsonic: VX2758-2KP-MHD; VS-code on label
    aoc: Q27G3XMN/BK; suffix after slash = color/region
    acer: XB273K V5; UM.HX3AA.V01 = orderable (V-suffix = gen)
    hp: Product 6G4Z4AA#ABA (#ABA = US)
    lenovo: MTM 63B0GAC1US; ThinkVision P27h-30
  schemes:
  - scheme: mfr_family
    level: family
  - scheme: mfr_model
    level: model
    normalize: upper_strip_spaces
  - scheme: hw_rev
    level: revision
    alias_only: false
  - scheme: edid_id
    level: revision
    pattern: ^[A-Z]{3}[0-9A-F]{4}$
  - scheme: mfr_sku
    level: package
  - scheme: gtin
    issuer: GS1
    level: package
  variant_axes:
  - gen.region
  - gen.color
  - panel.vendor
  - panel.part_number
  - gen.hw_revision
  model_defining:
  - gen.size_class
  - res.native
  - panel.technology
  - gen.form_factor
  note: 'Panel vendor/part varies at revision level: same model number can ship different panel generations. Specs the maker
    does not print are filled from reviews as conflicting claims tagged with revision when known.'
units:
  system: us_customary
  display:
    mm: in
    kg: lb
  custom:
  - unit: ppi
    base: ppi
    factor: 1
  - unit: year
    base: year
    factor: 1
  - unit: deg
    base: deg
    factor: 1
  - unit: ms
    base: ms
    factor: 1
conditions:
- id: overdrive
  label: Overdrive setting
  type: enum
  enum:
  - 'off'
  - normal
  - fast
  - fastest
- id: refresh_hz
  label: Refresh rate used
  type: number
  unit: Hz
- id: hdr_window_pct
  label: HDR test window size
  type: number
  unit: '%'
- id: brightness_pct
  label: Brightness setting
  type: number
  unit: '%'
- id: port
  label: Input port
  type: text
- id: firmware
  label: Firmware
  type: text
- id: power_basis
  label: Power measurement basis
  type: enum
  enum:
  - energy_star_on_mode
  - energy_star_sleep
- id: cts_version
  label: DisplayHDR CTS version
  type: text
- id: basis
  label: Evidence basis of the value (negative by enumeration, or derived from a certification)
  type: enum
  enum:
  - complete_enumeration
  - certification
  description: 'Coordinator ruling 1 (2026-11-24): a 0 / false written only because the maker''s own structured spec section enumerates
    every port of that kind (the full input list) and the feature is not among them. The list is kept as raw. certification (D9/D10,
    2026-11-25): a derived value that rests on a certification the maker prints, under the certifier''s published criteria (the claim''s
    locator names the rule and the certificate reference).'
groups:
- id: general
  label: General & identity
  order: 0
- id: panel
  label: Panel
  order: 1
- id: res
  label: Resolution & refresh
  order: 2
- id: motion
  label: Response & motion
  order: 3
- id: hdr
  label: HDR & brightness
  order: 4
- id: color
  label: Color
  order: 5
- id: flicker
  label: Flicker & eye comfort
  order: 6
- id: video_in
  label: Video inputs
  order: 7
- id: usbc
  label: USB-C, hub & KVM
  order: 8
- id: ergo
  label: Stand & mounting
  order: 9
- id: power
  label: Power
  order: 10
- id: support
  label: Warranty & support
  order: 11
specs:
- key: gen.brand
  label: Brand
  group: general
  type: enum
  unit: null
  tier: core
  facet: true
  why: Filter/ident
  level: family
  sources:
  - Manufacturer spec page
  example: LG
  enum_open: true
- key: gen.size_class
  label: Size class (marketed diagonal)
  group: general
  type: number
  unit: in
  tier: core
  facet:
    kind: range
    bins:
    - 24
    - 27
    - 32
    - 34
    - 40
    - 49
    column: true
  why: Primary buying filter
  level: model
  traps:
  - Marketed 27 vs real viewable 26.5 (LG 27GR95QE); ultrawide curved size is arc length
  sources:
  - Manufacturer spec page
  example: 27
  identity_role: model_defining
  note: 'Coordinator ruling 3 (2026-11-24): the class the maker prints is taken as stated (LG "22\" Class (21.5\" diagonal)" -> 22, Lenovo
    "Display Size", BenQ whole-inch "Screen Size"). Where only the panel / viewable diagonal is printed (ASUS "Panel Size (inch)", LG "Screen
    Size", BenQ "23.8\""), the class is derived by one deterministic rule, round half up to the whole inch (23.8 -> 24, 31.5 -> 32, 26.5 -> 27,
    21.45 -> 21): kind derived, locator.derivation size_class_round_half_up@1 (crawler/adapters/_monports.py), the stated diagonal as raw.
    A stated class always outranks the derived one (official > derived). LG itself prints 23.5" as a 23 class, so the derived class can
    differ from a maker''s own rounding by one inch near .5.'
- key: gen.viewable_diag
  label: Viewable diagonal
  group: general
  type: number
  unit: in
  tier: detail
  facet: false
  why: Real size
  level: model
  traps:
  - Often rounded up in the name
  sources:
  - Manufacturer spec page
  example: 26.5
- key: gen.release_year
  label: Release year
  group: general
  type: integer
  unit: null
  tier: important
  facet: true
  why: Age
  level: model
  sources:
  - Announce date; retailer
  example: 2024
- key: gen.hw_revision
  label: Hardware revision / version
  group: general
  type: text
  unit: null
  tier: core
  facet: false
  why: Same model number can ship different panel/scaler/board; the only handle on silent changes
  level: revision
  traps:
  - Rarely printed on spec pages; lives on rear label (Dell 'REV A01', Samsung 'ID'/'Ver.', ASUS 'Ver.')
  - LG '-B' suffix = US-market SKU in a family sold as e.g. 27GR95QE (no suffix) elsewhere
  - Reviewers (TFTCentral, RTINGS) sometimes note units differ
  sources:
  - Rear label photo; FCC ID filing; user manual; review notes
  example: A01
  identity_role: variant_axis
- key: gen.region
  label: Regional SKU / market
  group: general
  type: enum
  unit: null
  tier: core
  facet: true
  why: Specs, plugs, warranty differ by region
  level: package
  sources:
  - Manufacturer spec page
  example: US
  identity_role: variant_axis
  enum:
  - US
  - CA
  - EU
  - UK
  - APAC
  - other
  enum_open: true
- key: gen.color
  label: Chassis color
  group: general
  type: enum
  unit: null
  tier: detail
  facet: false
  why: Variant axis
  level: package
  sources:
  - Manufacturer spec page
  example: Black
  enum_open: true
  identity_role: variant_axis
- key: gen.segment
  label: Segment
  group: general
  type: enum
  unit: null
  tier: important
  facet: true
  why: Gaming / office / creator / business
  level: model
  sources:
  - Manufacturer spec page
  example: gaming
  enum:
  - gaming
  - office
  - creator
  - business
  - portable
  - tv-hybrid
  enum_open: true
- key: gen.form_factor
  label: Form factor
  group: general
  type: enum
  unit: null
  tier: important
  facet: true
  why: Flat / curved / ultrawide / portable
  level: model
  sources:
  - Manufacturer spec page
  example: flat
  enum:
  - flat
  - curved
  - ultrawide-flat
  - ultrawide-curved
  - super-ultrawide
  - portable
  - dual-screen
  enum_open: true
  identity_role: model_defining
- key: gen.curvature
  label: Curvature radius
  group: general
  type: text
  unit: null
  tier: important
  facet: false
  why: Comfort
  level: model
  traps:
  - R number only; lower = tighter
  sources:
  - Manufacturer spec page
  example: 1800R
- key: gen.msrp_launch
  label: Launch MSRP
  group: general
  type: number
  unit: USD
  tier: detail
  facet: false
  why: Context
  level: model
  sources:
  - Press release; mfr store
  example: 999
- key: gen.eol
  label: Discontinued / successor
  group: general
  type: text
  unit: null
  tier: detail
  facet: false
  why: Revision tracking
  level: model
  sources:
  - Mfr site; reviews
  example: Replaced by 27GX790A
- key: panel.technology
  label: Panel technology
  group: panel
  type: enum
  unit: null
  tier: core
  facet: true
  why: Biggest image-quality driver
  level: model
  traps:
  - '''Nano IPS'',''Fast IPS'',''ADS'' are IPS-type marketing names; ''IPS Black'' is a contrast class not a tech'
  - OLED subpixel type (WOLED vs QD-OLED) rarely in headline specs
  - Mini-LED product pages say 'IPS' and hide the backlight type
  sources:
  - Manufacturer spec page
  example: WOLED
  enum:
  - IPS
  - IPS Black
  - Nano IPS
  - Fast IPS
  - Fast IPS Black
  - VA
  - Fast VA
  - TN
  - WOLED
  - QD-OLED
  - Tandem OLED
  - Mini-LED IPS
  - Mini-LED VA
  - Mini-LED QD
  - other
  enum_open: true
  identity_role: model_defining
- key: panel.subpixel
  label: Subpixel layout / coating
  group: panel
  type: enum
  unit: null
  tier: important
  facet: true
  why: Text fringing; gen-3 QD-OLED & WOLED-4th-subpixel (RGWB) texts differ
  level: model
  traps:
  - Almost never in official specs; RTINGS/TFTCentral measure it
  sources:
  - RTINGS; TFTCentral; Reddit teardowns
  example: RWBG
  enum:
  - RGB stripe
  - RWBG
  - triangular QD-OLED
  - BGR
  - pentile
  - other
  enum_open: true
- key: panel.surface
  label: Screen surface
  group: panel
  type: enum
  unit: null
  tier: important
  facet: true
  why: Glare vs matte; OLED glossy traps
  level: model
  traps:
  - '''Anti-glare'' vs ''glossy'' only in fine print; QD-OLED raises blacks in light rooms'
  sources:
  - Manufacturer spec page
  example: glossy
  enum:
  - matte
  - glossy
  - semi-glossy
  - anti-glare light
  - unspecified
- key: panel.vendor
  label: Panel maker
  group: panel
  type: enum
  unit: null
  tier: core
  facet: true
  why: 'Panel lottery: same model number, different maker / generation'
  level: revision
  traps:
  - Never printed on spec pages; found in service manual, panel-ID tools, EDID, teardown, DisplaySpecifications
  sources:
  - RTINGS review; TFTCentral; EDID; panelook; user teardown
  example: LG Display
  identity_role: variant_axis
  enum:
  - LG Display
  - Samsung Display
  - AUO
  - Innolux
  - BOE
  - CSOT
  - HKC
  - Sharp
  - Tianma
  - other
  enum_open: true
- key: panel.part_number
  label: Panel part number
  group: panel
  type: text
  unit: null
  tier: important
  facet: false
  why: Pins down panel generation (e.g. LM270WQ...)
  level: revision
  traps:
  - Hardware revisions swap panel part; EDID manufacturer/product ID may differ per revision
  sources:
  - EDID dump; service manual; review
  example: LM270WQ1-SSA1
  identity_role: variant_axis
- key: panel.generation
  label: Panel generation / series
  group: panel
  type: text
  unit: null
  tier: important
  facet: false
  why: e.g. QD-OLED gen 3, WOLED MLA
  level: revision
  traps:
  - Marketing '4th gen' counts differ by maker
  sources:
  - Review sites
  - Press release
  example: Gen 3 QD-OLED
- key: panel.bit_depth
  label: Panel bit depth (native/FRC)
  group: panel
  type: enum
  unit: null
  tier: core
  facet: true
  why: 8-bit+FRC marketed as 10-bit
  level: model
