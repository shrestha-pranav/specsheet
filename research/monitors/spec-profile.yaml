  label: Native resolution
  group: res
  type: text
  unit: null
  tier: core
  facet: true
  why: Pixel count
  level: model
  traps:
  - Must be native panel, not max input (8K input on 4K panel)
  sources:
  - Manufacturer spec page
  example: 2560x1440
  identity_role: model_defining
- key: res.width_px
  label: Width px
  group: res
  type: integer
  unit: px
  tier: important
  facet: false
  why: Derived
  level: model
  sources:
  - Manufacturer spec page
  example: 2560
- key: res.height_px
  label: Height px
  group: res
  type: integer
  unit: px
  tier: important
  facet: false
  why: Derived
  level: model
  sources:
  - Manufacturer spec page
  example: 1440
- key: res.ppi
  label: Pixel density
