  unit: ms
  tier: core
  facet: false
  why: Headline number
  level: model
  traps:
  - GtG in 'fastest' mode at overdrive; MPRT 1 ms = backlight strobing; 'faster than 1ms' ranges
  sources:
  - Manufacturer spec page
  example: 0.03
- key: motion.gtg_basis
  label: Response time basis
  group: motion
  type: enum
  unit: null
  tier: core
  facet: true
