- key: motion.input_lag
  label: Input lag
  group: motion
  type: number
  unit: ms
  tier: important
  facet: false
  why: Competitive play
  level: model
  traps:
  - Native vs OC/VRR-on differ
  sources:
  - RTINGS; TFTCentral
  example: 4
  conditions:
  - refresh_hz
- key: hdr.vesa_tier
  label: VESA DisplayHDR tier (certified)
  group: hdr
  type: enum
  unit: null
  tier: core
  facet: true
  why: HDR claim vs cert
  level: model
  conditions:
  - cts_version
  basis_conditions:
  - cts_version
  traps:
  - '''HDR10'', ''HDR400'', ''HDR Ready'' are not certification; only ''DisplayHDR N'' badge + displayhdr.org list counts'
  - DisplayHDR 400 needs no local dimming and only 250 nits
  - Cert is per model; revision/panel change may not be recertified
  sources:
  - displayhdr.org Certified Products list (by company+model)
  example: DisplayHDR 600
  enum:
  - none
  - DisplayHDR 400
  - DisplayHDR 500
  - DisplayHDR 600
  - DisplayHDR 1000
  - DisplayHDR 1400
  - DisplayHDR True Black 400
  - DisplayHDR True Black 500
  - DisplayHDR True Black 600
  - DisplayHDR True Black 1000
  - DisplayHDR True Black 1400
  required: true
  identity_role: none
- key: hdr.formats
  label: HDR formats supported
  group: hdr
  type: list
  unit: null
  tier: important
  facet: false
  why: HDR10 / HLG / Dolby Vision
  level: model
  traps:
  - '''HDR10'' means input accepted, nothing about quality'
  sources:
  - Manufacturer spec page
  example:
  - HDR10
  items: enum
- key: hdr.marketed_label
  label: HDR marketing label
  group: hdr
  type: text
  unit: null
  tier: important
  facet: false
  why: Catches uncertified claims
  level: model
  traps:
  - '''HDR 400'' with no ''DisplayHDR'' = uncertified'
  sources:
  - Manufacturer spec page
  example: HDR10
- key: hdr.peak_marketed
  label: Peak brightness (marketed HDR)
  group: hdr
  type: number
  unit: nit
  tier: important
  facet: true
  why: Headline
  level: model
  sources:
  - Manufacturer spec page
  example: 1000
- key: hdr.peak_measured_2pct
  label: Measured peak, 2% window
  group: hdr
  type: number
  unit: nit
  tier: important
  facet: false
  why: Real HDR highlight
  level: model
  sources:
  - RTINGS; TFTCentral
  example: 1000
  conditions:
  - hdr_window_pct
- key: hdr.peak_measured_10pct
  label: Measured peak, 10% window
  group: hdr
  type: number
  unit: nit
  tier: important
