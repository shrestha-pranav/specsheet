- key: usb.usbc_inputs
  label: USB-C video input count
  group: usbc
  type: integer
  unit: null
  tier: core
  facet: true
  why: Single-cable laptops
  level: model
  conditions:
  - basis
  basis_conditions:
  - basis
  traps:
  - Downstream / charging-only / data-only USB-C ports (hub ports, 'USB-C Upstream, Data only') are not video inputs
  - '"2x Thunderbolt 4 (Daisy Chain)" or "one upstream, one downstream": which port is the input is unstated, so no count'
  - A spec table without a USB-C row is not proof of no USB-C unless the table is the maker's full port list (ruling 1)
  sources:
  - Manufacturer spec page (full port list)
  example: 1
  note: 'Count of USB-C / Thunderbolt / USB4 ports the maker lists as taking video from the computer (DP Alt Mode, DisplayPort, Thunderbolt;
    not downstream/out/data-only). A USB-C line whose role is unstated writes nothing. Coordinator ruling 1 (2026-11-24): 0 is written only
    when the maker''s own structured port section (ASUS I/O Ports list, Lenovo PSREF port lists, BenQ Connectivity, LG Input/Output group)
    enumerates every port, names at least one video input, and no USB-C port on the page is a video input; it carries
    {basis: complete_enumeration} and the list as raw. USB-C named anywhere else on the page (an accessory cable, a signal-frequency row)
    voids the zero. Prose, marketing bullets, partial tables and missing sections never give 0.'
