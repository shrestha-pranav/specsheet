- key: noise.db
  label: Noise (claimed)
  group: noise
  type: number
  unit: dB
  tier: important
  level: model
  conditions:
  - power_mode
  - claim_basis
  basis_conditions:
  - power_mode
  - claim_basis
  facet: false
  why: Running while home / at night
  traps:
  - Distance, weighting (dBA) and mode are rarely stated; brands quote the quietest mode ('Lowest Noise')
  - Comparison charts against unnamed "Others"
  sources:
  - Manufacturer spec block ('Noise', 'Lowest Noise'); independent dB-at-1m tests (not collected)
  example: 56
- key: smart.matter
  label: Matter support
  group: smart
  type: bool
  unit: null
  tier: important
  level: model
  facet:
    kind: bool
  why: Works with Apple Home / Google / Alexa / Home Assistant through one standard
  traps:
  - '"Matter will be available through an upcoming OTA" (Roborock Qrevo Edge page) is a promise, not support: not recorded as true'
  - The certifier record (CSA Matter Distributed Compliance Ledger, robotic-vacuum device type) is the certification-grade source; maker pages are
    manufacturer claims
  - 'Review 3: trusted ONLY from a CSA DCL row whose product name (brand word removed) equals the US-store model exactly and that has a certified
    compliance record (claim/dcl-matter-certified). A maker page tick ("Matter Connectivity ✓") stays a preview manufacturer claim'
  sources:
  - 'certification: CSA DCL (on.dcl.csa-iot.org REST API, csa_dcl_robovac): the only trusted source'
  - 'Manufacturer spec block ("Matter Connectivity"): preview only'
  example: true
