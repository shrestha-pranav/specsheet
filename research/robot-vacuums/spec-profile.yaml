profile_format: specsheet.category-profile/1
category: robot-vacuums
version: 0.1.0
label: Robot vacuums & mops
market: US
status: draft
scope: Consumer robot vacuums and vacuum-mop robots (with or without a dock) sold in the US by the maker's own US store (Dreame, Roborock, Narwal built;
  Ecovacs, iRobot, Eufy, Shark, SwitchBot, MOVA, Lefant, Yeedi probed). Excludes stick, handheld and wet-dry floor washers, window/pool/lawn robots,
  refurbished units (a condition, not a model) and replacement parts.
note: 'A1 2026-11-23. Every number on a robot-vacuum page is a manufacturer claim measured under an undisclosed house method. The profile therefore
  carries the claim basis as a basis condition (claim_basis) on suction, noise and runtime, and the operating mode (power_mode) on runtime and noise.
  Claim origin is three-way and is expressed with existing fields, not a new one: manufacturer = claim kind official + source tier manufacturer
  (claim_basis mfr_in_house_lab | mfr_unstated); certification = kind official + claim_basis third_party_certified (TUV/SGS/Intertek named in the
  page disclaimer) or a certifier source tier (CSA Matter DCL, FCC); measured = kind measured (independent tests, RTINGS/Vacuum Wars sealed-inlet
  suction or dB at 1 m), never mixed into the headline with manufacturer figures (resolve.py basis rules give per-basis alternatives).'
identity:
  levels:
  - level: family
    label: Product line
    meaning: 'Series letters: Dreame L/X/D/Aqua/Matrix, Roborock Qrevo/Saros/S/Q, Narwal Freo/Flow'
    key_schemes:
    - mfr_family
    inherits: false
  - level: model
    label: Model
    meaning: 'One robot + dock design: Dreame L40s Ultra, Roborock Qrevo Edge S5A, Narwal Freo Z10 Turbo. Colours, App-Only/Live-Only/Membership
      listings and accessory-kit packs of the same SKU set are the same model.'
    key_schemes:
    - mfr_model
    inherits: true
  - level: configuration
    label: Colour / pack SKU
    meaning: 'Manufacturer material code per colour or pack: Dreame 010204AA000742, Roborock RR-QrevoEdgeS5A5-M2, Narwal CP-ZD-A00331-00-00'
    key_schemes:
    - mfr_sku
    inherits: true
  - level: package
    label: Retail package
    meaning: GTIN-level box (rarely published by the makers' stores)
    key_schemes:
    - gtin
    inherits: true
  primary_key: Manufacturer model name as printed on the maker's US spec block (these brands print no regulatory model code on US pages), plus
    the maker's material-code SKU per colour/pack. Retail titles ('... 25,000Pa Suction, Auto-Empty ...') are aliases only. FCC ID and the
    label model code (e.g. Roborock 'QR02RR'-style, Dreame 'RLxxxx') are alias schemes that cross-check identity, never merge keys.
  per_brand:
    dreame: L40s Ultra (model), 010204AA000742 / 010204AA000823 (white / black material codes)
    roborock: Qrevo Edge S5A (model), RR-QrevoEdgeS5A5-M2 (colour digit 5 = black, 0 = white); 'with Refill & Drainage System' = separate model '<name> RDS'
    narwal: Freo Z10 Turbo (model), CP-ZD-A00331-00-00 (material code; '_DTC_N_US_YJ_260510' channel/date tag stripped)
    irobot: C975020 (Roomba Combo j9+; iRobot prints a real model/SKU code in the URL), not built
    eufy: T2351 / T210M111 (eufy T-codes are model numbers), not built
    ecovacs: DEEBOT X8 PRO OMNI (model), not built
    shark: RV2620WD (Shark model codes), blocked
  schemes:
  - scheme: mfr_family
    level: family
  - scheme: mfr_model
    level: model
    normalize: upper_strip_spaces
  - scheme: mfr_sku
    level: configuration
    normalize: upper_keep_slash
  - scheme: gtin
    issuer: GS1
    level: package
  - scheme: fcc_id
    issuer: FCC
    level: model
    alias_only: true
    pattern: ^[A-Z0-9]{3,5}[A-Z0-9-]{1,14}$
  - scheme: matter_vid_pid
    issuer: CSA
    level: model
    alias_only: true
  variant_axes:
  - gen.color
  model_defining:
  - nav.type
  - mop.type
  - dock.self_empty
  note: 'App Only / Live Only / Membership / Group-buy pages repeat a model with the same material-code SKUs; grouping is by SKU overlap (adapters).
    "Complete" (Dreame X50 Ultra Complete) shares a SKU with the plain page on dreametech.com and is therefore the same model; MOVA and Dreame
    elsewhere sell "Complete" as robot + accessory kit, so treat it as a package hint, never a different robot.'
units:
  system: us_customary
  display:
    mm: in
    g: lb
  custom:
  - unit: Pa
    base: Pa
    factor: 1
  - unit: mL
    base: mL
    factor: 1
  - unit: min
    base: min
    factor: 1
conditions:
- id: claim_basis
  label: Claim basis (how the figure was obtained)
  type: enum
  enum:
  - mfr_in_house_lab
  - mfr_unstated
  - mfr_reported_certified
  - third_party_certified
  - independent_measured
  description: 'mfr_in_house_lab = page disclaimer says "based on our in-house lab data"; mfr_unstated = no basis printed (also: a disclaimer that names
    a lab or certifier without an affirmative statement, or a negated one such as "not certified by SGS"); mfr_reported_certified = the manufacturer''s
    disclaimer affirmatively attributes THIS figure to TUV/SGS/Intertek/UL ("certified by ...": a manufacturer statement, certificate not checked
    here, review 3); third_party_certified = a certifier-tier source we read ourselves; independent_measured = a non-manufacturer test (sealed-inlet
    suction, dB at a stated distance). Claim bases are not comparison methods: two figures on different bases never form a ranking cohort.'
- id: power_mode
  label: Operating mode
  type: enum
  enum:
  - quiet
  - standard
  - max
  - unstated
groups:
- id: general
  label: General & identity
  order: 0
- id: clean
  label: Vacuuming
  order: 1
- id: mop
  label: Mopping
  order: 2
- id: nav
  label: Navigation & obstacle avoidance
  order: 3
- id: battery
  label: Battery & runtime
  order: 4
- id: dock
  label: Dock / base station
  order: 5
- id: noise
  label: Noise
  order: 6
- id: smart
  label: Smart home & app
  order: 7
- id: phys
  label: Size & weight
  order: 8
specs:
- key: gen.brand
  label: Brand
  group: general
  type: enum
  unit: null
  tier: core
  level: family
  enum: [dreame, roborock, narwal, ecovacs, irobot, eufy, shark, switchbot, mova, lefant, yeedi]
  enum_open: true
  facet:
    kind: enum
    column: true
  why: Filter
  sources:
  - Manufacturer US store
  example: dreame
- key: gen.color
  label: Colour
  group: general
  type: text
  unit: null
  tier: detail
  level: configuration
  identity_role: variant_axis
  facet: false
  why: Only difference between most sibling SKUs
  sources:
  - Shopify variant option (product JSON)
  example: Black
- key: clean.suction_pa
  label: Maximum suction (claimed)
  group: clean
  type: number
  unit: Pa
  tier: core
  level: model
  conditions:
  - claim_basis
  basis_conditions:
  - claim_basis
  facet:
    kind: range
    bins: [5000, 10000, 15000, 20000, 25000, 30000, 36000]
    column: true
  why: The headline number every listing leads with
  traps:
  - 'Not comparable across brands: no standard test (inlet sealed or open, at fan or at brush, peak or sustained); brands print "based on our
    in-house lab data" at best. Independent sealed-inlet tests rank robots differently from the Pa figures.'
  - Max suction is a short boost mode (carpet boost / MAX+), not the default cleaning level
  - Pa doubled roughly every year (4,200 Pa in 2021 -> 36,000 Pa in 2026) while measured pickup changed far less
  - Retail titles repeat the number with a different model's figure (bundle pages, older generation)
  sources:
  - Manufacturer spec block ('Maximum Suction (Pa)', Dreame/Narwal) + disclaimer line for the basis
  - Roborock Key Features bullet or page title
  - 'independent: sealed-inlet tests (Vacuum Wars, RTINGS) -> claim_basis independent_measured (not collected yet)'
  notes: 'Claim origin: manufacturer (official, mfr_in_house_lab | mfr_unstated) or certification (third_party_certified). Never measured by us.'
  example: 19000
- key: clean.dustbin_ml
  label: Robot dustbin capacity
  group: clean
  type: number
  unit: mL
  tier: important
  level: model
  facet:
    kind: range
    bins: [200, 300, 400, 500]
  why: How often a robot without self-empty needs emptying
  traps:
  - '"≥300ml" is a lower bound: not normalised'
  - Robots with a combined water/dust box print one figure for both
  sources:
  - Manufacturer spec block ('Dust Box Capacity')
  example: 310
- key: clean.main_brush_type
  label: Main brush
  group: clean
  type: text
  unit: null
  tier: important
  level: model
  facet: false
  why: Hair tangling and carpet pickup depend on brush design (rubber vs bristle, single vs dual, cutter)
  traps:
  - Trademarked names (HyperStream DuoBrush, TriCut, DuoRoller) hide whether it is rubber, bristle or both
  - '"0 tangles" claims are TUV-certified on a narrow hair test'
  sources:
  - Manufacturer spec block ('Main Brush Type')
  example: HyperStream Detangling DuoBrush
- key: clean.main_brush_lifting
  label: Main brush lifts
  group: clean
  type: bool
  unit: null
  tier: detail
  level: model
  facet:
    kind: bool
  why: Keeps a wet brush off rugs when mopping
  sources:
  - Manufacturer spec block
  example: true
- key: clean.side_brush_extending
  label: Extending side brush
  group: clean
  type: bool
  unit: null
  tier: detail
  level: model
  facet:
    kind: bool
  why: Edge and corner pickup
  sources:
  - Manufacturer spec block
  example: true
- key: clean.side_brush_lifting
  label: Side brush lifts
  group: clean
  type: bool
  unit: null
  tier: detail
  level: model
  facet: false
  why: Avoids scattering wet debris
  sources:
  - Manufacturer spec block
  example: true
- key: clean.dirt_detection
  label: Dirt detection / re-clean
  group: clean
  type: bool
  unit: null
  tier: detail
  level: model
  facet: false
  why: Re-cleans dirty spots
  sources:
  - Manufacturer spec block
  example: true
- key: mop.type
  label: Mop type
  group: mop
  type: enum
  unit: null
  tier: core
  level: model
  identity_role: model_defining
  enum: [none, static_pad, vibrating_pad, dual_spinning, roller, track]
  facet:
    kind: enum
    column: true
  why: Spinning pads and rollers scrub; a static pad only wipes
  traps:
  - '"Vacuum and mop" on a robot with a dragged static pad'
  - 'Review 3: dual_spinning needs an explicit count AND rotation ("dual rotating mops"); "single rotating mop" has no enum value; trademarks
    ("Omni-Scrub"), bare "mop pad" and "dual mops" stay unresolved'
  - Marketing names (Omni-Scrub, SpiraFlow, HydroJet) hide the mechanism
  sources:
  - Manufacturer spec block ('Mop Type')
  example: dual_spinning
- key: mop.lifting
  label: Mop lifts on carpet
  group: mop
  type: bool
  unit: null
  tier: important
  level: model
  facet:
    kind: bool
  why: Whether rugs stay dry without removing the pads
  sources:
  - Manufacturer spec block ('Mop Lifting')
  example: true
- key: mop.lift_height_mm
  label: Mop lift height
  group: mop
  type: number
  unit: mm
  tier: important
  level: model
  facet:
    kind: range
    bins: [5, 7, 10, 15, 20]
  why: 7 mm clears low-pile rugs only; 20 mm+ or auto-removal handles thick carpet
  traps:
  - Height measured from the floor to the lifted pad 'based on in-house lab data'
  sources:
  - Manufacturer spec block ('Mop Lifting' / 'Mop Lifting Height')
  example: 10.5
- key: mop.auto_removal
  label: Mops detach automatically
  group: mop
  type: bool
  unit: null
  tier: important
  level: model
  facet:
    kind: bool
  why: Vacuums thick carpet without dragging pads
  sources:
  - Manufacturer spec block ('Mop Removal')
  example: true
- key: mop.extending
  label: Mop extends to edges
  group: mop
  type: bool
  unit: null
  tier: detail
  level: model
  facet: false
  why: Edge mopping
  sources:
  - Manufacturer spec block ('Mop Extending', 'MopExtend RoboSwing')
  example: true
- key: mop.robot_tank_ml
  label: Robot water tank
  group: mop
  type: number
  unit: mL
  tier: detail
  level: model
  facet: false
  why: Mopping area per fill on robots without dock refill
  sources:
  - Manufacturer spec block ('Water Tank Capacity', 'Clean/Used Water Box')
  example: 80
- key: mop.auto_refill_from_dock
  label: Dock refills robot tank
  group: mop
  type: bool
  unit: null
  tier: detail
  level: model
  facet: false
  why: Continuous mopping in large homes
  sources:
  - Manufacturer spec block ('Auto Water Tank Refilling (from Dock to Robot)')
  example: true
- key: nav.type
  label: Navigation
  group: nav
  type: enum
  unit: null
  tier: core
  level: model
  identity_role: model_defining
  enum: [lidar, dtof, vslam_camera, gyroscope, none]
  facet:
    kind: enum
    column: true
  why: LiDAR maps reliably in the dark; camera vSLAM needs light; gyro robots do not map
  traps:
  - Trademarked names ('Pathfinder Smart Navigation', 'PreciSense') do not say which sensor; they stay unknown
  - 'Retractable / in-body dToF LiDAR (VersaLift, Saros) is still LiDAR (enum dtof) but sits lower. dtof is a KIND of lidar: a LiDAR filter must
    match [lidar, dtof] (hierarchy-aware), never lidar alone'
  - 'Review 3: only explicit mechanism phrases are trusted (LDS/LiDAR, dToF, vSLAM, gyro). Generic "laser", "camera", "visual", two mechanisms in one
    cell, or any negation stay as unresolved preview claims with the literal and the reason'
  sources:
  - Manufacturer spec block ('Navigation')
  example: lidar
- key: nav.obstacle_sensors
  label: Obstacle sensor types
  group: nav
  type: list
  unit: null
  tier: core
  level: model
  items: enum
  enum: [structured_light, rgb_camera, tof, infrared, ultrasonic]
  facet:
    kind: multi
  why: Structured light sees cables and socks in 3D; an RGB camera classifies objects (pet waste); bumper-only robots hit everything
  traps:
  - '"AI obstacle avoidance" without a sensor name'
  - 'Review 3: "AI camera" / "vision" does not say RGB, and bare "laser" does not say structured light; a cell with any generic or negated term
    stays unresolved (a partial list would assert the robot lacks the unnamed sensor). Trusted: structured light / line laser, RGB / RGBD, ToF'
  - LED illumination is listed with the sensors but is a light, not a sensor
  - Object-count claims ('280 object types') are classifier labels, not detection reliability
  sources:
  - Manufacturer spec block ('Obstacle Avoidance')
  example: [structured_light, rgb_camera]
- key: nav.obstacle_crossing_mm
  label: Threshold climb (single step)
  group: nav
  type: number
  unit: mm
  tier: important
  level: model
  facet:
    kind: range
    bins: [18, 20, 22, 30, 40]
  why: Door saddles and rug edges strand robots
  traps:
  - 'Pages print a double-layer step (two 2 cm steps, 4-8 cm) next to the single step; only the single-step figure is comparable and is the one
    stored. A cell with several figures and no single-step label is not normalised.'
  sources:
  - Manufacturer spec block ('Obstacle Crossing Height', 'Threshold Crossing')
  example: 22
- key: nav.ai_object_types
  label: Recognised object types (claimed)
  group: nav
  type: integer
  unit: null
  tier: detail
  level: model
  facet: false
  why: Marketing figure; detail only
  sources:
  - Manufacturer spec block ('AI Recognition & Object Type Count')
  example: 280
- key: bat.capacity_mah
  label: Battery capacity
  group: battery
  type: number
  unit: mAh
  tier: important
  level: model
  facet:
    kind: range
    bins: [2600, 3200, 5200, 6400, 7000]
  why: Coverage per charge (with runtime)
  traps:
  - mAh without the pack voltage is not energy; most packs are 14.4 V Li-ion (4S) but the voltage is not printed, so Wh is not derived
  - Bigger battery does not mean longer runtime at max suction
  sources:
  - Manufacturer spec block ('Battery Capacity (mAh)', Roborock 'Battery Type')
  example: 5200
- key: bat.energy_wh
  label: Battery energy
  group: battery
  type: number
  unit: Wh
  tier: important
  level: model
  facet: false
  why: The comparable battery figure (mAh x voltage)
  traps:
  - Never derived from mAh without a printed voltage
  sources:
  - Manual / label (not on US store pages)
  example: 74.9
- key: bat.runtime_min
  label: Runtime (claimed)
  group: battery
  type: number
  unit: min
  tier: important
  level: model
  conditions:
  - power_mode
  - claim_basis
  basis_conditions:
  - power_mode
  - claim_basis
  facet: false
  why: Whole-home coverage on one charge
  traps:
  - Always the quiet / lowest-suction, vacuum-only mode ('up to 220 minutes in Quiet Mode'); max-suction runtime is a fraction of it
  sources:
  - Manufacturer spec block / feature text with mode
  example: 220
