category: power-strips
version: 0.1
scope: "US market. Surge protectors (UL 1449 Type 3 SPD cord-connected), plain relocatable power taps (UL 1363), USB power strips, smart strips."
identity:
  levels: [family, model, configuration, package]
  primary_key: "manufacturer model number incl. cord-length/colour suffix (cord length and colour are separate SKUs: BE112230-08 vs -10)"
  per_brand: {tripplite_eaton: "ISOBAR6ULTRA, TLP1208SAT", apc: "P12U2 (apc.com redirects to se.com)", cyberpower: "CSB604 (multipacks CSB604MP2 = package level)", belkin: "SRA009p12tt8 / BE112230-08 (two numbering schemes, same product)", tplink_kasa: "HS300 (hardware versions v1/v2 have different datasheets)"}
  notes: "Same family reissued with changed joules/standard edition (ISOBAR6ULTRA 2350J -> 3330J; Belkin 3780 vs 3940J on one page). Version/revision must be a tracked field."
groups:
  - {id: type, label: "Product type & standard"}
  - {id: surge, label: "Surge protection"}
  - {id: safety, label: "Safety & status"}
  - {id: outlets, label: "Outlets"}
  - {id: cord, label: "Cord & plug"}
  - {id: load, label: "Electrical rating"}
  - {id: usb, label: "USB charging"}
  - {id: smart, label: "Smart features"}
  - {id: phys, label: "Physical & mounting"}
  - {id: cert, label: "Certification & warranty"}
specs:
  # ---- type / standard
  - {key: type.kind, label: "Product kind", group: type, type: enum, enum: [surge_protector, plain_power_strip, smart_strip, usb_strip, wall_tap, power_center], tier: core, facet: true, why: "A strip with no SPD gives zero surge protection.", traps: ["'Surge protector' in the title on a plain UL 1363 tap", "'Power strip with surge protection' wording without a joule/VPR", "Plain strips labelled 'overload protected' only"], sources: ["title+spec table; UL listing category XBYS (taps) vs XUHT/XUJA (SPD)"], example: surge_protector}
  - {key: type.ul1449_listed, label: "UL 1449 listed (Type 3 SPD)", group: cert, type: bool, tier: core, facet: true, why: "Only UL 1449 listing means the SPD was actually tested; ETL/'tested to' is weaker for buyers.", traps: ["'Meets UL 1449' / 'tested to UL standards' without a listing", "ETL/Intertek listing to the same standard is legit but UL-only filter would exclude it", "Lists standard but not the edition"], sources: ["spec table 'Certifications'; UL Product iQ (XBYS) by file number; package mark"], example: true}
  - {key: type.ul1449_edition, label: "UL 1449 edition", group: cert, type: enum, enum: ["3rd", "4th", "5th", "unknown"], tier: important, facet: true, why: "5th ed. (2021) tightens SPD safety/abnormal-overvoltage tests; older units are grandfathered and VPR numbers are not comparable across editions (3rd edition lists 330/400/500/600/700+ VPR bins).", traps: ["Same datasheet says '3rd Edition' in features and '5th Ed Rev 2021' in specs (ISOBAR6ULTRA)", "Edition often only on the product label"], sources: ["datasheet 'Product Certifications'; label photo"], example: "5th"}
  - {key: type.ul1363_listed, label: "UL 1363 listed (relocatable power tap)", group: cert, type: bool, tier: important, facet: false, why: "1363 covers cord/outlet/breaker construction; a surge strip with >2 outlets needs both 1449 and 1363.", traps: ["Surge-labelled strip listed only to 1449 or only to 1363"], sources: ["datasheet; UL Product iQ XBYS"], example: true}
  - {key: type.csa_standard, label: "CSA standard", group: cert, type: text, tier: detail, facet: false, why: "Canadian equivalent, e.g. CAN/CSA-C22.2 No. 369.3.", traps: [], sources: ["Eaton datasheet 'Product Certifications'"], example: "CAN/CSA-C22.2 No. 369.3:2017"}
  # ---- surge
  - {key: surge.vpr_ln, label: "VPR line-neutral", group: surge, type: number, unit: V, tier: core, facet: true, why: "Voltage let-through during the UL test pulse (6 kV/3 kA); LOWER is better. The only comparable number across brands.", traps: ["Marketing leads with joules instead of VPR", "Single 'clamping voltage' with no mode", "Brands pick the best mode", "VPR is a bin (330,400,500,600,700,800...), not measured value", "Eaton 'UL1449 Let Through 330V' is one number for all modes"], sources: ["Belkin spec table (L-N/L-G/N-G), CyberPower datasheet ('Clamping Voltage 500V (H-N,H-G,N-G)'), TP-Link datasheet ('VPR 600V'), Eaton PDF", "UL Product iQ rarely shows it; product label"], example: 400}
  - {key: surge.vpr_lg, label: "VPR line-ground", group: surge, type: number, unit: V, tier: core, facet: true, why: "As above, common-mode path.", traps: ["Often omitted; only worst-case given"], sources: ["same as vpr_ln"], example: 500}
  - {key: surge.vpr_ng, label: "VPR neutral-ground", group: surge, type: number, unit: V, tier: important, facet: false, why: "As above.", traps: ["Omitted or merged"], sources: ["same"], example: 500}
  - {key: surge.vpr_max, label: "VPR worst mode (derived)", group: surge, type: number, unit: V, tier: core, facet: true, why: "Sortable single value; derive = max of modes; flag when modes not published.", traps: ["Derived field, never invent when only one number is given - store as stated with modes_unspecified"], sources: ["derived"], example: 500}
  - {key: surge.joules, label: "Energy rating", group: surge, type: number, unit: J, tier: important, facet: true, why: "Roughly how many/large surges the MOVs absorb before wearing out. NOT standardised: UL 1449 does not test or verify it.", traps: ["Unreliable: no common test method; manufacturers sum MOV ratings across all modes", "Bigger joules does not mean lower VPR", "Same product shown with different joules on one page (Belkin 3780 vs 3940J; CyberPower CSB604 900 J vs 1800 J)", "Multi-pack and revision changes (ISOBAR6ULTRA 2350 -> 3330 J)", "Plain strips advertise nothing but some print 'joules' for filters only"], sources: ["title, spec table, datasheet"], example: 3330}
  - {key: surge.max_surge_current, label: "Max surge current (peak)", group: surge, type: number, unit: A, tier: detail, facet: false, why: "Peak current absorbed; stated per mode sometimes.", traps: ["Summed across modes (CyberPower 45,000 = 3x15,000)", "Eaton 97,000 vs 135,000 in one PDF"], sources: ["datasheet"], example: 45000}
  - {key: surge.max_spike_voltage, label: "Max spike voltage", group: surge, type: number, unit: V, tier: detail, facet: false, why: "Test spike, almost always 6000 V (IEEE C62.41 Cat B) - non-differentiating.", traps: ["Presented as a protection spec"], sources: ["spec table"], example: 6000}
  - {key: surge.mcov, label: "MCOV / MOV rating", group: surge, type: number, unit: V, tier: detail, facet: false, why: "Maximum continuous operating voltage of MOVs; higher survives sustained overvoltage.", traps: ["Almost never published for consumer strips; Eaton shows '140V RMS clamping' style numbers"], sources: ["rare: datasheet, UL listing report not public"], example: 140}
  - {key: surge.response_time, label: "Response time", group: surge, type: text, tier: detail, facet: false, why: "Marketing metric (<1 ns); MOVs all similar.", traps: ["Meaningless differentiator"], sources: ["datasheet"], example: "<1 ns"}
  - {key: surge.emi_rfi, label: "EMI/RFI noise filtering", group: surge, type: bool, tier: important, facet: true, why: "Filters line noise for audio/network gear.", traps: ["'EMI filter' with no dB or frequency", "dB figure taken at best frequency (Belkin 'up to 75dB', Eaton '40-80 dB', CyberPower 32 dB)"], sources: ["spec table"], example: true}
  - {key: surge.emi_db, label: "EMI attenuation", group: surge, type: range, unit: dB, tier: detail, facet: false, why: "Comparable only with frequency band.", traps: ["'up to' phrasing"], sources: ["datasheet"], example: "40-80"}
  - {key: surge.emi_band, label: "EMI filter band", group: surge, type: text, tier: detail, facet: false, why: "e.g. 150 kHz-100 MHz.", traps: [], sources: ["datasheet"], example: "150 kHz-100 MHz"}
  - {key: surge.isolated_banks, label: "Isolated filter banks", group: surge, type: number, tier: detail, facet: false, why: "Separates noisy loads from audio/network gear.", traps: [], sources: ["Eaton datasheet"], example: 3}
  - {key: surge.dataline, label: "Data-line protection", group: surge, type: list, enum: [coax, ethernet, phone_dsl], tier: important, facet: true, why: "Coax/Ethernet/phone pass-through protection.", traps: ["'Coax protected' on the page but joules only for AC"], sources: ["spec table 'Data line protection'"], example: [coax, phone_dsl]}
  # ---- safety
  - {key: safety.auto_shutoff, label: "Auto shut-off on protection failure", group: safety, type: bool, tier: core, facet: true, why: "Cuts power when MOVs are spent; without it the strip still powers gear but protects nothing.", traps: ["Only an indicator LED goes out and outlets stay live", "Named 'Power Safety Shut Down' (Belkin), 'Automatic shutoff' (Eaton), 'automatic shutdown' (CyberPower)", "Thermal fusing is different and not equivalent"], sources: ["spec table"], example: true}
  - {key: safety.protected_led, label: "Protected/protection-present LED", group: safety, type: bool, tier: important, facet: true, why: "Tells user if surge protection is alive.", traps: ["Plain 'power' light is not a protection indicator"], sources: ["spec table; datasheet LED details"], example: true}
  - {key: safety.ground_led, label: "Ground fault / wiring fault LED", group: safety, type: bool, tier: important, facet: true, why: "Warns of open ground/reversed polarity (Belkin 'NOT GND', Eaton LINE FAULT).", traps: [], sources: ["spec table"], example: true}
  - {key: safety.led_details, label: "LED/alarm details", group: safety, type: text, tier: detail, facet: false, why: "Colours, audible alarm.", traps: [], sources: ["datasheet"], example: "Protection present (green), line fault (red)"}
  - {key: safety.breaker, label: "Circuit breaker rating", group: safety, type: number, unit: A, tier: important, facet: false, why: "Resettable breaker rating limits usable load; may be less than 15 A.", traps: ["Eaton ISOBAR6ULTRA 12 A breaker vs '15 A' plug; 'overload protection' with no amps"], sources: ["datasheet"], example: 12}
  # ---- outlets
  - {key: outlets.count, label: "AC outlets (total)", group: outlets, type: number, tier: core, facet: true, why: "Primary buying filter.", traps: ["Counts include USB or protected-only outlets", "Some outlets 'surge only' vs battery"], sources: ["title, spec table"], example: 12}
  - {key: outlets.protected_count, label: "Surge-protected outlets", group: outlets, type: number, tier: detail, facet: false, why: "Not all outlets are always protected.", traps: [], sources: ["datasheet"], example: 12}
  - {key: outlets.spaced, label: "Wide/transformer-spaced outlets", group: outlets, type: number, tier: important, facet: true, why: "Number of outlets usable with bulky adapters.", traps: ["'Wide-spaced' with no count; Belkin '6 block-space outlets'", "Eaton gives center-to-center mm"], sources: ["spec table; Eaton 'Transformer Accommodation (2)'"], example: 6}
  - {key: outlets.spacing_mm, label: "Outlet center spacing", group: outlets, type: object, unit: mm, tier: detail, facet: false, why: "Real fit proof.", traps: [], sources: ["Eaton datasheet only"], example: {h: 39.45, v: 39.30}}
  - {key: outlets.rotating, label: "Rotating/pivot outlets", group: outlets, type: bool, tier: detail, facet: true, why: "Space for adapters.", traps: [], sources: ["spec table"], example: false}
  - {key: outlets.right_angle, label: "Right-angle/side-facing outlets", group: outlets, type: bool, tier: detail, facet: false, why: "Plugs tight to wall.", traps: [], sources: ["Eaton 'Right-Angle Outlets'"], example: false}
  - {key: outlets.switch, label: "Master switch / switched groups", group: outlets, type: enum, enum: [none, master, per_group, per_outlet], tier: important, facet: true, why: "Cut standby power.", traps: [], sources: ["spec table"], example: master}
  - {key: outlets.covers, label: "Safety shutters/covers", group: outlets, type: bool, tier: detail, facet: false, why: "Child safety.", traps: [], sources: ["datasheet"], example: true}
  # ---- cord
  - {key: cord.length_ft, label: "Cord length", group: cord, type: number, unit: ft, tier: core, facet: true, why: "Reach.", traps: ["Measured how: includes plug? SKU suffix and listing disagree", "Belkin: -08 vs 8-foot"], sources: ["title, spec table"], example: 6}
  - {key: cord.gauge_awg, label: "Cord gauge", group: cord, type: number, unit: AWG, tier: important, facet: true, why: "14 AWG for full 15 A; 16 AWG is thinner and limits safe load; hot cords.", traps: ["Often omitted (only Eaton publishes consistently)", "AWG on cord vs inside"], sources: ["Eaton datasheet 'Input Cord Gauge (AWG)'; label/manual"], example: 14}
  - {key: cord.jacket, label: "Cord type", group: cord, type: text, tier: detail, facet: false, why: "SJT etc.", traps: [], sources: ["Eaton"], example: SJT}
  - {key: cord.plug_style, label: "Plug style", group: cord, type: enum, enum: [straight, right_angle, flat, pivot], tier: important, facet: true, why: "Flat/right-angle plug lets furniture sit against wall.", traps: ["'Flat plug' vs 'right-angle' used interchangeably"], sources: ["spec table"], example: right_angle}
  - {key: cord.plug_type, label: "Plug type", group: cord, type: enum, enum: [NEMA 5-15P, NEMA 5-20P], tier: detail, facet: false, why: "US standard.", traps: [], sources: ["datasheet"], example: "NEMA 5-15P"}
  # ---- load
  - {key: load.max_amps, label: "Max current", group: load, type: number, unit: A, tier: core, facet: true, why: "Rated input current (15 A typical).", traps: [], sources: ["spec table"], example: 15}
  - {key: load.max_watts, label: "Max load", group: load, type: number, unit: W, tier: core, facet: true, why: "15 A x 125 V = 1875 W; breaker may cap lower (Eaton 1440 W at 12 A).", traps: ["1875 W printed though breaker is 12 A", "Continuous load is 80% (1440 W)"], sources: ["spec table, label"], example: 1875}
  - {key: load.voltage, label: "Rated voltage", group: load, type: number, unit: V, tier: detail, facet: false, why: "125 V typical.", traps: [], sources: ["spec table"], example: 125}
  # ---- usb
  - {key: usb.ports, label: "USB ports", group: usb, type: object, tier: core, facet: true, why: "Counts of A and C ports.", traps: ["'USB' counts multiple connectors sharing one budget"], sources: ["spec table"], example: {a: 2, c: 1}}
  - {key: usb.total_w, label: "USB total power", group: usb, type: number, unit: W, tier: core, facet: true, why: "Shared budget across ports.", traps: ["Sum of per-port max, not what is available when all in use", "TP-Link '5V 2.4A Each & Total'"], sources: ["spec table"], example: 30}
  - {key: usb.per_port_w, label: "Per-port max power", group: usb, type: list, unit: W, tier: important, facet: false, why: "One port may be 20W PD, others 12W.", traps: ["Only highest value advertised"], sources: ["spec table"], example: [20, 12]}
  - {key: usb.pd, label: "USB PD / PPS / QC support", group: usb, type: list, enum: [PD, PPS, QC, none], tier: important, facet: true, why: "Fast charging protocols.", traps: ["'Fast charging' with no protocol"], sources: ["spec table"], example: [PD]}
  - {key: usb.always_on, label: "USB always-on (not switched)", group: usb, type: bool, tier: detail, facet: false, why: "", traps: [], sources: ["datasheet"], example: true}
  # ---- smart
  - {key: smart.connectivity, label: "Connectivity", group: smart, type: list, enum: [wifi_2_4, wifi_5, thread, zigbee, bluetooth, none], tier: important, facet: true, why: "Setup and ecosystem.", traps: ["2.4 GHz only"], sources: ["datasheet"], example: [wifi_2_4]}
  - {key: smart.matter, label: "Matter support", group: smart, type: bool, tier: important, facet: true, why: "Ecosystem-neutral control.", traps: ["'Works with Alexa' != Matter"], sources: ["spec table"], example: false}
  - {key: smart.ecosystems, label: "Voice/ecosystems", group: smart, type: list, tier: detail, facet: false, why: "", traps: [], sources: ["spec table"], example: [Alexa, Google, SmartThings]}
  - {key: smart.energy_monitoring, label: "Energy monitoring", group: smart, type: enum, enum: [none, total, per_outlet], tier: important, facet: true, why: "Per-outlet watts/kWh.", traps: ["Total only vs per-outlet"], sources: ["datasheet"], example: per_outlet}
  - {key: smart.control_granularity, label: "Individually controlled outlets", group: smart, type: number, tier: important, facet: true, why: "", traps: ["Only some outlets controllable"], sources: ["spec table"], example: 6}
  # ---- phys
  - {key: phys.dimensions, label: "Dimensions (L x W x H)", group: phys, type: object, unit: in, tier: important, facet: false, why: "Fit on desk/behind furniture.", traps: ["Belkin page omits; Eaton lists unit and shipping separately and h/w/d order changes"], sources: ["datasheet"], example: {l: 14.2, w: 2.5, h: 1.5}}
  - {key: phys.weight_lb, label: "Weight", group: phys, type: number, unit: lb, tier: detail, facet: false, why: "", traps: [], sources: ["datasheet"], example: 1.41}
  - {key: phys.mounting, label: "Mounting", group: phys, type: list, enum: [keyhole, wall_bracket, adhesive, under_desk_clamp, none], tier: important, facet: true, why: "", traps: [], sources: ["spec table"], example: [keyhole]}
  - {key: phys.form, label: "Form factor", group: phys, type: enum, enum: [horizontal, tower, flat_wall_tap, desktop_cube, rack], tier: important, facet: true, why: "", traps: [], sources: ["title"], example: horizontal}
  - {key: phys.material, label: "Housing material", group: phys, type: enum, enum: [plastic, metal], tier: detail, facet: false, why: "", traps: [], sources: ["Eaton"], example: metal}
  # ---- cert / warranty
  - {key: cert.listing_mark, label: "Listing body(ies)", group: cert, type: list, enum: [UL, ETL, CSA, other], tier: important, facet: true, why: "Third-party listing; 'ETL certified' on Kasa HS300 not UL.", traps: ["'UL recognized' (components) vs 'UL listed'", "Counterfeit marks"], sources: ["datasheet; UL Product iQ; Intertek Directory"], example: [ETL]}
  - {key: cert.ul_file_number, label: "UL file number (E#)", group: cert, type: text, tier: detail, facet: false, why: "Verifies listing; Belkin = E152555.", traps: ["Listing page lists model prefixes with wildcards, not full SKUs", "Importer file numbers cover private-label clones"], sources: ["UL Product Spec / Product iQ, product label (rarely web)"], example: E152555}
  - {key: cert.warranty_years, label: "Product warranty", group: cert, type: text, tier: important, facet: true, why: "'Lifetime' vs 2 yr.", traps: ["Lifetime = product life"], sources: ["spec table"], example: "Lifetime limited"}
  - {key: cert.cew_usd, label: "Connected-equipment warranty", group: cert, type: number, unit: USD, tier: important, facet: true, why: "Paid out if gear damaged by surge.", traps: ["Requires registration/proof/receipt", "Voided if protection indicator off", "Belkin $300,000 on one page vs 'Yes'; Eaton $50,000 US/CA/PR only", "Same name, very different claim terms"], sources: ["spec table; warranty PDF"], example: 300000}
  - {key: cert.replacement_advice, label: "Replacement interval advice", group: cert, type: text, tier: detail, facet: false, why: "Belkin says replace after 3 years.", traps: [], sources: ["support pages"], example: "3 years"}
