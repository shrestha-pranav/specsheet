- key: feat.filter_indicator
  label: Filter-change indicator
  group: smart
  type: bool
  unit: null
  tier: detail
  level: model
  facet: false
  why: Reminds you to replace filters
  sources: [Winix 'Filter Replacement Indicator', Levoit Features 'Check Filter Indicator']
  example: true
- key: phys.width_in
  label: Width
  group: phys
  type: number
  unit: in
  tier: detail
  level: model
  facet: false
  why: Fit
  traps: ['Only from a label that names the axis order (W x D x H); "10.8 x 10.8 x 20.5 in" without axes stays text']
  sources: [Winix 'Product Dimensions (W x D x H)']
  example: 13.7
- key: phys.depth_in
  label: Depth
  group: phys
  type: number
  unit: in
  tier: detail
  level: model
  facet: false
