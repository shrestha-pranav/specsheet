name: Clothes washers
description: "US clothes washers by maker model number and by ENERGY STAR certified pattern (one DOE basic model covering several finishes,
  shown as its own row and flagged): front- or top-load, combo / laundry center, DOE capacity (never the larger IEC figure), IMEF and IWF
  under DOE Appendix J2 with the federal limits, annual kWh and gallons, width (height and depth where filed), features, connected.
  Source: ENERGY STAR Certified Residential Clothes Washers (U.S. EPA). Absent from ENERGY STAR = unknown, never 'not certified'."
columns: [config.load, capacity.doe_ft3, water.iwf, energy.annual_kwh, cert.energy_star]
