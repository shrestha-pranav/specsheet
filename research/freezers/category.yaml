name: Freezers
description: "US stand-alone freezers (upright, chest, compact) by maker model number and by ENERGY STAR certified pattern (one DOE basic
  model covering several finishes or hinges, shown as its own row and flagged): ENERGY STAR type and DOE product class, defrost, compact /
  built-in, DOE total and adjusted volume (adjusted volume is never shown as capacity), annual kWh under DOE Appendix B with the federal
  limit and % below it, refrigerant, ice maker, connected. ENERGY STAR publishes no dimensions for freezers. Source: ENERGY STAR Certified
  Residential Freezers (U.S. EPA). Absent from ENERGY STAR = unknown, never 'not certified'."
columns: [config.es_type, capacity.total_ft3, energy.annual_kwh, config.defrost, cert.energy_star]
# r12 A2-appl2: same pattern-entity rules as refrigerators (scripts/escover.py). Coverage edges stay proposals (no relation policy names
# energystar_siblings@1: the dataset documents '*' = a letter, A1's matcher uses [A-Z0-9]; ruling requested).
