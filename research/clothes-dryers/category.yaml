name: Clothes dryers
description: "US clothes dryers by maker model number and by ENERGY STAR certified pattern (one DOE basic model covering several finishes,
  shown as its own row and flagged): electric or gas, vented or ventless, heat pump (where filed), DOE drum capacity, CEF and annual kWh
  under DOE Appendix D2, test-cycle time, voltage (where filed), dimensions, refrigerant, features, connected. Source: ENERGY STAR Certified
  Residential Clothes Dryers (U.S. EPA). Absent from ENERGY STAR = unknown, never 'not certified'; a blank heat-pump field is unknown."
columns: [config.fuel, config.ventless, config.heat_pump, capacity.drum_ft3, energy.cef, cert.energy_star]
