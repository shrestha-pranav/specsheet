- key: port.usbc_list
  label: 'USB-C ports: per port protocol, side, PD in/out W, DP alt'
  group: ports
  type: list
  unit: null
  tier: core
  facet: false
  why: Which port charges and drives displays
  traps:
  - Lists 'USB-C' without TB/USB4 vs 10Gbps vs 5Gbps; PD range e.g. 15-65W, DP only on some ports
  sources:
  - PSREF Standard Ports, Dell manual External ports, Apple specs
  example:
  - side: left
    protocol: USB4
    usb_gbps: 40
    pd_in_w: 15-65
    dp_alt: DP 2.1
  items:
    fields:
    - key: side
      type: enum
      enum:
      - left
      - right
      - rear
      - unknown
    - key: protocol
      type: text
    - key: usb_gbps
      type: number
      unit: Gbps
    - key: pd_in_w
      type: range
      unit: W
    - key: pd_out_w
      type: number
      unit: W
    - key: dp_alt
      type: text
  level: model
