category: laptops
version: 0.2
identity:
  levels:
  - level: family
    label: Product family
    meaning: e.g. ThinkPad T14s Gen 6 (Intel); psref product key. Never passes specs down.
    key_schemes:
    - mfr_family
    inherits: false
  - level: model
    label: Platform model
    meaning: Machine Type / chassis + CPU platform (e.g. 83TD)
    key_schemes:
    - machine_type
    - mfr_model
    inherits: true
  - level: configuration
    label: Orderable configuration
    meaning: Lenovo MTM / HP product number / Dell SKU / Apple model+BTO
    key_schemes:
    - mtm
    - mfr_sku
    inherits: true
  - level: package
    label: Retail package
    meaning: Barcoded retail unit incl. region and charger
    key_schemes:
    - gtin
    inherits: true
  primary_key: 'Manufacturer part number naming one fixed config (Lenovo MTM, HP product number with #ABA suffix, Dell orderable
    SKU, Apple model + BTO tuple); regional suffix is significant, never stripped.'
  per_brand:
    lenovo: MTM e.g. 83DK0002US; Machine Type = first 4 chars (model level)
    hp: Product number e.g. 8Z4X1AV#ABA
    dell: Model + orderable SKU
    apple: Model number Axxxx + chip/RAM/SSD tuple
    asus: Model code e.g. UX5406SA-xxx
    framework: Edition SKU + chosen modules
    microsoft: Part number per config
  schemes:
  - scheme: mtm
    issuer: Lenovo
    pattern: ^[0-9A-Z]{10}$
    normalize: upper_strip_dashes
    level: configuration
  - scheme: machine_type
    issuer: Lenovo
    pattern: ^[0-9A-Z]{4}$
    level: model
  - scheme: mfr_sku
    level: configuration
  - scheme: mfr_model
    level: model
  - scheme: mfr_family
    level: family
  - scheme: gtin
    issuer: GS1
    level: package
  variant_axes:
  - mem.size
  - stor.size
  - disp.resolution
  - disp.touch
  - gen.color
  - sw.os
  - in.fingerprint
  - wl.wwan
  - in.webcam
  - gen.region
  model_defining:
  - cpu.model
  - gpu.model
  - mem.soldered
  - disp.size
  - pwr.battery_wh
  note: Platform variant (e.g. Lunar vs Arrow Lake) is model-level; see spec.level.
groups:
- id: general
  label: General
- id: cpu
  label: Processor
- id: gpu
  label: Graphics / NPU
- id: memory
  label: Memory
- id: storage
  label: Storage
- id: display
  label: Display
- id: ports
  label: Ports & USB-C
- id: power
  label: Battery & charger
- id: wireless
  label: Wireless
- id: input
  label: Input, camera, security
- id: physical
  label: Physical
- id: sw
  label: OS & warranty
specs:
- key: gen.platform_variant
  label: Platform variant (Intel/AMD/Snapdragon, Lunar vs Arrow Lake)
  group: general
  type: enum
  unit: null
  tier: core
  facet: true
  why: Weight, ports, wifi and RAM type differ by platform within one family
  traps:
  - Same family name, different hardware
  sources:
  - PSREF notes
  example: Lunar Lake
  aliases:
  - id.platform_variant
  level: model
- key: gen.release_year
  label: Release year
  group: general
  type: number
  unit: null
  tier: important
  facet: true
  why: Age
  sources:
  - spec page
  example: 2026
  aliases:
  - id.release_year
  level: configuration
- key: gen.region
  label: Region / SKU market
  group: general
  type: enum
  unit: null
  tier: core
  facet: true
  why: Adapters, warranty, keyboard layout, options vary by country
  traps:
  - 'PSREF: ''AC adapter offerings depend on the country'''
  sources:
  - PSREF notes, retailer
  example: US
  aliases:
  - id.region
  level: configuration
  identity_role: variant_axis
- key: gen.color
  label: Color
  group: general
  type: enum
  unit: null
  tier: important
  facet: true
  why: Some colors only on some platforms
  traps:
  - Grey only for Arrow Lake; color changes weight
  sources:
  - PSREF Case Color
  example: Grey
  aliases:
  - id.color
  level: configuration
  identity_role: variant_axis
- key: gen.form_factor
  label: Form factor
  group: general
  type: enum
  unit: null
  tier: important
  facet: true
  why: Clamshell/2-in-1/detachable
  sources:
  - spec page
  example: clamshell
  aliases:
  - id.form_factor
  level: configuration
- key: gen.segment
  label: Segment
  group: general
  type: enum
  unit: null
  tier: detail
  facet: true
  why: Business/consumer/gaming/workstation
  sources:
  - ''
  example: business
  aliases:
  - id.segment
  level: configuration
- key: cpu.model
  label: Processor model
  group: cpu
  type: text
  unit: null
  tier: core
  facet: true
  why: Primary perf driver
  traps:
  - Marketing says 'Core Ultra 7' w/o suffix; 256V vs 258V differ
  sources:
  - PSREF Processor table, Intel/AMD ARK
  example: Intel Core Ultra 7 258V
  level: model
  identity_role: model_defining
- key: cpu.cores_threads
  label: Cores (P/E/LPE) and threads
  group: cpu
  type: text
  unit: null
  tier: important
  facet: false
  why: Cores (P/E/LPE) and threads
  traps:
  - Total cores hides P vs E
  sources:
  - PSREF, ARK
  example: 8C/8T
  level: model
- key: cpu.boost_clock
  label: Max boost clock
  group: cpu
  type: number
  unit: GHz
  tier: detail
  facet: false
  why: Max boost clock
  traps:
  - Boost is not sustained
  sources:
  - PSREF, ARK
  example: 4.8
  level: model
- key: cpu.base_clock
  label: Base clock
  group: cpu
  type: number
  unit: GHz
  tier: detail
  facet: false
  why: Base (P-core) clock as the manufacturer states it
  traps:
  - Hybrid CPUs state P-core and E-core clocks separately; this is the P-core base
  sources:
  - PSREF Processor cell, ARK
  example: 2.0
  level: model
- key: cpu.cores
  label: CPU cores
  group: cpu
  type: integer
  unit: null
  tier: important
  facet: true
  why: Total core count, split out of the processor cell
  traps:
  - Total cores hides P vs E split (kept in cpu.cores_threads)
  sources:
  - PSREF Processor cell, ARK
  example: 8
  level: model
- key: cpu.threads
  label: CPU threads
  group: cpu
  type: integer
  unit: null
  tier: detail
  facet: false
  why: Thread count, split out of the processor cell
  traps: []
  sources:
  - PSREF Processor cell, ARK
  example: 16
  level: model
- key: cpu.cache
  label: CPU cache
  group: cpu
  type: text
  unit: null
  tier: detail
  facet: false
  why: Cache as stated (L2/L3 split for AMD, Smart Cache total for Intel); literal, not summed
  traps:
  - Intel Smart Cache vs AMD L3 are not comparable totals
  sources:
  - PSREF Processor cell, ARK
  example: 4MB L2 / 8MB L3
  level: model
- key: cpu.tdp_base
  label: Base power (PBP/TDP)
  group: cpu
  type: number
  unit: W
  tier: important
  facet: true
  why: Sustained perf and fan noise
  traps:
  - Config-set cTDP varies per OEM chassis
  sources:
  - ARK; PSREF rarely
  example: '17'
  level: model
- key: cpu.tdp_configured
  label: OEM configured power limit (PL1/PL2)
  group: cpu
  type: range
  unit: W
  tier: important
  facet: false
  why: Same chip, different chassis limits
  traps:
  - Almost never published; reviews only
  sources:
  - reviews/BIOS
  example: PL1 17 / PL2 37
  level: model
- key: cpu.vpro
  label: vPro support
  group: cpu
  type: bool
  unit: null
  tier: detail
  facet: true
  why: Business mgmt
  traps:
  - Separate WLAN line items in PSREF
  sources:
  - PSREF
  example: false
  level: model
- key: cpu.npu_tops
  label: NPU TOPS
  group: cpu
  type: number
  unit: TOPS
  tier: important
  facet: true
  why: Copilot+ PC eligibility (>=40)
