- key: mem.soldered
  label: RAM soldered / on-package
  group: memory
  type: enum
  unit: null
  tier: core
  facet: true
  why: Upgradability
  traps:
  - '''Up to 64GB'' listing hides that it cannot be upgraded'
  - 'ASUS ''16GB DDR5 on board, Max Capacity:32GB'' with no SO-DIMM named: a free slot is possible, so placement stays unknown (not soldered)'
  sources:
  - PSREF Max Memory/Slots, Dell manual Memory, Framework
  - 'ASUS techspec Memory cell: on board / on package / SO-DIMM (asus@2)'
  example: soldered
  level: configuration
